apiVersion: apps/v1
kind: Deployment
metadata:
  name: base-watcher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: base-watcher
  template:
    metadata:
      labels:
        app: base-watcher
        archon.io/spread-group: chain-ingest
    spec:
      serviceAccountName: base-watcher
      # Soft spread across every chain-ingest pod (watchers + block republishers) so one
      # node replacement cannot re-pack all chains onto a single new node. ORB-439.
      topologySpreadConstraints:
        - topologyKey: kubernetes.io/hostname
          maxSkew: 1
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              archon.io/spread-group: chain-ingest
      containers:
        - name: base-watcher
          # Image name used as the Kustomize images transformer key.
          # The overlay kustomization.yaml overrides newName + newTag.
          image: base-watcher
          args: ["--enable-traces=false"]
          env:
            # Inject the deployment name so each per-chain watcher emits a
            # distinct OTEL service.name (e.g. "watcher", "arbitrum-watcher").
            - name: SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']
          envFrom:
            - configMapRef:
                name: otel-config
            - configMapRef:
                name: base-watcher-config
            - secretRef:
                # Populated by ExternalSecret — secret name mirrors the service.
                name: base-watcher
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "100m"
              memory: "1024Mi"
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pgrep -f watcher"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      terminationGracePeriodSeconds: 90

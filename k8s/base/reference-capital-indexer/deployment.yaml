# Temporal cronjob worker. The schedule lives in Temporal state, not here:
# changing REFERENCE_CAPITAL_SYNC_INTERVAL requires deleting the schedule in
# Temporal and restarting (see stl-verify/AGENTS.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reference-capital-indexer
spec:
  replicas: 1
  # Explicit, matching the API-server default — ArgoCD must own spec.strategy or
  # a later change to it cannot prune rollingUpdate. k8s/AGENTS.md, "Rollout strategy".
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: reference-capital-indexer
  template:
    metadata:
      labels:
        app: reference-capital-indexer
    spec:
      serviceAccountName: reference-capital-indexer
      containers:
        - name: reference-capital-indexer
          image: reference-capital-indexer
          env:
            - name: IMAGE_DIGEST
              valueFrom:
                configMapKeyRef:
                  name: stl-verify-image-digests
                  key: reference-capital-indexer
                  optional: true
          envFrom:
            - configMapRef:
                name: otel-config
            - configMapRef:
                name: reference-capital-indexer
            - secretRef:
                name: reference-capital-indexer
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      terminationGracePeriodSeconds: 60

# Deliberately not referenced by any overlay and not an ArgoCD PreSync hook: the
# run is expensive and on demand, so a sync must never fire it. Apply it by hand
# per env — see docs/runbooks/vector-indexers.md#uniswap-v4-indexer-vec-475.
apiVersion: batch/v1
kind: Job
metadata:
  name: uniswap-v4-position-bootstrap
spec:
  # No auto-retry: a restart re-derives its own head-64 pin and would stitch one
  # snapshot across two heights. Resume a failed run by hand with -pin.
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: uniswap-v4-position-bootstrap
    spec:
      serviceAccountName: uniswap-v4-indexer
      restartPolicy: Never
      containers:
        - name: uniswap-v4-position-bootstrap
          image: uniswap-v4-position-bootstrap
          envFrom:
            - configMapRef:
                name: uniswap-v4-indexer-config
            - secretRef:
                name: uniswap-v4-indexer
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              # Peak memory is one window's logs plus one 500-position multicall
              # batch, so it is bounded by the widest window, not by history.
              cpu: "1000m"
              memory: "512Mi"

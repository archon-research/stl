# Deliberately not in any synced overlay's resources and not an ArgoCD PreSync
# hook: the run is expensive and on demand, so a sync must never fire it. Apply
# it by hand through k8s/overlays/<env>/uniswap-v4-position-bootstrap/, which
# pins the image — see docs/runbooks/vector-indexers.md#uniswap-v4-indexer-vec-475.
apiVersion: batch/v1
kind: Job
metadata:
  name: uniswap-v4-position-bootstrap
spec:
  # No auto-retry: a restart re-derives its own head-64 pin and would stitch one
  # snapshot across two heights. Resume a failed run by hand with -pin.
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: uniswap-v4-position-bootstrap
    spec:
      serviceAccountName: uniswap-v4-indexer
      restartPolicy: Never
      containers:
        - name: uniswap-v4-position-bootstrap
          image: uniswap-v4-position-bootstrap
          envFrom:
            - configMapRef:
                name: uniswap-v4-indexer-config
            - secretRef:
                name: uniswap-v4-indexer
          # Empty = the binary's default. Set PIN_BLOCK to resume a failed run's
          # snapshot; the overlay's patch is the place to do it per env.
          env:
            - name: PIN_BLOCK
              value: ""
            - name: FROM_BLOCK
              value: ""
            - name: FINALITY_DEPTH
              value: ""
            - name: INITIAL_WINDOW
              value: ""
            - name: MIN_WINDOW
              value: ""
            - name: MAX_WINDOW
              value: ""
            - name: POSITION_BATCH
              value: ""
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              # Peak memory is the distinct position keys plus one window's logs
              # plus one multicall batch: ~70 B per key, so ~10^6 keys fit.
              cpu: "1000m"
              memory: "512Mi"

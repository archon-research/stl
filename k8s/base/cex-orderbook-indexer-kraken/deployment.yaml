apiVersion: apps/v1
kind: Deployment
metadata:
  name: cex-orderbook-indexer-kraken
spec:
  # One pod per exchange (single persistent WebSocket connection group). The book
  # is rebuilt from a fresh snapshot on restart, so a second replica would only
  # duplicate writes — keep it at 1.
  replicas: 1
  # Explicit, matching the API-server default — ArgoCD must own spec.strategy or
  # a later change to it cannot prune rollingUpdate. k8s/AGENTS.md, "Rollout strategy".
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: cex-orderbook-indexer-kraken
  template:
    metadata:
      labels:
        app: cex-orderbook-indexer-kraken
    spec:
      serviceAccountName: cex-orderbook-indexer-kraken
      containers:
        - name: cex-orderbook-indexer-kraken
          # Image name is the Kustomize images-transformer key; the overlay sets
          # newName + newTag. All three exchange pods share one binary, selected at
          # runtime by EXCHANGE.
          image: cex-orderbook-indexer
          envFrom:
            - configMapRef:
                name: otel-config
            - configMapRef:
                name: cex-orderbook-indexer-kraken-config
            - secretRef:
                name: cex-orderbook-indexer-kraken
          resources:
            requests:
              # 250m, not the fleet's 50m: measured demand is ~1.3 cores, so a 50m
              # request had the scheduler place this pod as if it were idle.
              cpu: "250m"
              memory: "64Mi"
            limits:
              # 1500m, not the fleet's usual 200m: the per-frame sorts make this the
              # most expensive of the three venues, and at 500m staging was denied
              # 0.24-0.82 CPU seconds per second (ARCT-321) on two symbols alone.
              # okx stays at 200m — it idles at single-digit millicores.
              cpu: "1500m"
              memory: "256Mi"
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pgrep -f cex-orderbook-indexer"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      terminationGracePeriodSeconds: 60

apiVersion: apps/v1
kind: Deployment
metadata:
  name: robinhood-backup-worker
spec:
  replicas: 1
  # Recreate, per k8s/AGENTS.md "Rollout strategy": sns.EventSink keys the FIFO
  # MessageGroupId on the chain id, so one chain is one message group and a surged
  # pod could only poll alongside the incumbent, never drain in parallel with it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: robinhood-backup-worker
  template:
    metadata:
      labels:
        app: robinhood-backup-worker
    spec:
      serviceAccountName: robinhood-backup-worker
      containers:
        - name: robinhood-backup-worker
          # Distinct image key — the overlay maps this to the shared backup-worker
          # ECR repo. Same binary as backup-worker; chain is selected via CHAIN_ID.
          image: robinhood-backup-worker
          envFrom:
            - configMapRef:
                name: otel-config
            - configMapRef:
                name: robinhood-backup-worker-config
            - secretRef:
                name: robinhood-backup-worker
          # Raised over the sibling backup workers' 50m/64Mi + 200m/256Mi because
          # this chain runs WORKERS=10 rather than 2 (see the overlay ConfigMap).
          # CPU is 2.5x, not 5x: per message only the gzip of the block and its
          # receipts is CPU-bound, the rest is one HeadObject, two Redis reads and
          # two PUTs. 512Mi is margin over an unmeasured payload size, not a
          # measurement — an OOMKill hides a whole batch for the 180s visibility
          # timeout and no alert covers that. Revisit both once staging has data.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pgrep -f raw-data-backup"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      terminationGracePeriodSeconds: 60

apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-anchorage-indexer
spec:
  replicas: 1
  # Explicit, matching the API-server default — ArgoCD must own spec.strategy or
  # a later change to it cannot prune rollingUpdate. k8s/AGENTS.md, "Rollout strategy".
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: spark-anchorage-indexer
  template:
    metadata:
      labels:
        app: spark-anchorage-indexer
    spec:
      serviceAccountName: spark-anchorage-indexer
      containers:
        - name: spark-anchorage-indexer
          image: spark-anchorage-indexer
          envFrom:
            - configMapRef:
                name: spark-anchorage-indexer
            - secretRef:
                name: spark-anchorage-indexer
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      terminationGracePeriodSeconds: 90

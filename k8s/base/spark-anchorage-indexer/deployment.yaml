apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-anchorage-indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-anchorage-indexer
  template:
    metadata:
      labels:
        app: spark-anchorage-indexer
    spec:
      serviceAccountName: spark-anchorage-indexer
      containers:
        - name: spark-anchorage-indexer
          image: spark-anchorage-indexer
          envFrom:
            # Without otel-config the OTLP endpoint is unset, InitOTEL installs
            # no-op providers and this worker exports no metrics at all — which
            # is why cronjob_runs_total has never carried service_name="anchorage-indexer".
            - configMapRef:
                name: otel-config
            - configMapRef:
                name: spark-anchorage-indexer
            - secretRef:
                name: spark-anchorage-indexer
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      terminationGracePeriodSeconds: 60

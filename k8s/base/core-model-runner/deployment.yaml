apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-model-runner
spec:
  replicas: 1
  # Recreate, not RollingUpdate (k8s/AGENTS.md: a single Temporal consumer wants
  # Recreate): the 25% surge rounds up to a second worker on one task queue, and
  # its short-lived extra pod is what hands Karpenter an underutilized node to
  # consolidate ~10 min after every deploy — which killed a tick mid-run on
  # 2026-08-27 (VEC-681) and left a surge pod Pending on a full staging cluster
  # on 2026-08-31. Overlap-SKIP on the schedule already guarantees one tick.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: core-model-runner
  template:
    metadata:
      labels:
        app: core-model-runner
      annotations:
        # A tick is unretryable Monte Carlo (maximum_attempts=1), so a voluntary
        # eviction loses the day's run rather than costing a restart (VEC-681).
        # Stopgap: it pins the node through the ~23.5h the pod idles, and does
        # nothing on staging's spot nodes. Remove once the tick resumes per market.
        karpenter.sh/do-not-disrupt: "true"
    spec:
      serviceAccountName: core-model-runner
      containers:
        - name: core-model-runner
          # Runs out of the python-api image: the model, its parquet inputs and
          # the runner entry point all ship inside stl-verify/python.
          image: core-model-runner
          command: ["python", "-m", "cli.cronjobs.core_model_runner.main"]
          envFrom:
            - configMapRef:
                name: otel-config
            - configMapRef:
                name: core-model-runner
            - secretRef:
                name: core-model-runner
          env:
            - name: CORE_MODEL_MARKET_KEY
              value: "all"
          # Larger than the other cronjobs (50m/64Mi, IO against an external
          # API): this tick is the GARCH fit and Monte Carlo itself,
          # in-process and single-threaded (forecaster.py pins the MC to
          # n_jobs=1 -- loky workers would multiply the per-scenario tensors;
          # the calibrator backtest still runs 4 joblib workers, hence the cpu
          # limit). Memory is 2 * borrowers * N_MC * 15 * 8 bytes (the
          # liquidator's two USD tensors) and the markets run one after another
          # in one process, so the pod peak is the heaviest market plus ~0.2 GiB
          # that lingers between markets. Measured on live staging data at
          # N_MC=10000 with MIN_BORROW_USD=100 (2026-09-07): full 9-market pass
          # 1.56 GiB peak RSS, 24 min wall on a laptop (7.5 GiB without the
          # filter: sparklend_dai has 2,204 rows, 1,580 of them under $1 of
          # debt). Re-measure before raising N_MC or lowering MIN_BORROW_USD;
          # replacing the tensors with per-scenario valuation is a follow-up.
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
      terminationGracePeriodSeconds: 60

# Temporal cronjob worker. The schedule lives in Temporal state, not here: the
# worker reconciles a changed CORE_MODEL_REFERENCE_SYNC_INTERVAL into it on startup,
# so a redeploy is enough (see stl-verify/AGENTS.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-model-reference-indexer
spec:
  replicas: 1
  # Explicit, matching the API-server default — ArgoCD must own spec.strategy or
  # a later change to it cannot prune rollingUpdate. k8s/AGENTS.md, "Rollout strategy".
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: core-model-reference-indexer
  template:
    metadata:
      labels:
        app: core-model-reference-indexer
    spec:
      serviceAccountName: core-model-reference-indexer
      containers:
        - name: core-model-reference-indexer
          image: core-model-reference-indexer
          envFrom:
            - configMapRef:
                name: otel-config
            - configMapRef:
                name: core-model-reference-indexer
            - secretRef:
                name: core-model-reference-indexer
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      terminationGracePeriodSeconds: 90

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
spec:
  serviceName: timescaledb
  replicas: 1
  selector:
    matchLabels:
      app: timescaledb
  template:
    metadata:
      labels:
        app: timescaledb
    spec:
      containers:
        - name: timescaledb
          image: timescale/timescaledb:2.25.1-pg17
          # pg_stat_statements is a shared library, so it only exists if it is
          # preloaded at server start — CREATE EXTENSION alone is not enough. The
          # image preloads timescaledb via its own config; naming both here keeps
          # timescaledb loaded while adding the statistics collector the
          # db-statement-stats cronjob reads (VEC-545).
          args:
            - postgres
            - -c
            - shared_preload_libraries=timescaledb,pg_stat_statements
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: stl_verify
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          hostPath:
            path: /data/timescaledb
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
spec:
  type: NodePort
  selector:
    app: timescaledb
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30432

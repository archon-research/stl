apiVersion: v1
kind: ConfigMap
metadata:
  name: localstack-init
data:
  init-aws.sh: |
    #!/bin/bash
    # LocalStack initialization script for STL-Verify
    # This script can be run manually to set up LocalStack resources.
    #
    # Creates SNS FIFO topic and SQS FIFO queues that mirror the production AWS setup.
    # Architecture: SNS FIFO → Multiple SQS FIFO queues (fan-out pattern)

    set -euo pipefail

    echo "=== Initializing LocalStack AWS resources ==="

    # Region used for all resources
    REGION="us-east-1"
    ACCOUNT_ID="000000000000"
    ENDPOINT="${AWS_ENDPOINT_URL:-http://localhost:4566}"

    # Use aws CLI with LocalStack endpoint
    AWS="aws --endpoint-url=$ENDPOINT"

    # Set dummy credentials for LocalStack
    export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-test}"
    export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-test}"

    # Deployment environment, injected from stl-config. Raw-block bucket names are
    # derived from it as stl-sentinel{DEPLOY_ENV}-{chain}-raw, the exact format
    # chainutil.ValidateS3BucketForChain enforces at worker startup — so the buckets
    # created here and the S3_BUCKET values the workers get cannot drift apart.
    DEPLOY_ENV="${DEPLOY_ENV:-development}"

    # Helper: create SNS topic, backup SQS queue, subscription, and raw-block S3
    # bucket for a chain. Every chain gets its own bucket: workers validate that
    # S3_BUCKET matches their CHAIN_ID, so a non-Ethereum worker cannot share the
    # Ethereum bucket.
    # Worker-specific queues (oracle-price, sparklend, etc.) are created separately below.
    create_chain_resources() {
      local CHAIN_NAME=$1

      echo "Creating ${CHAIN_NAME} SNS FIFO topic..."
      $AWS sns create-topic \
        --name "stl-${CHAIN_NAME}-blocks.fifo" \
        --attributes FifoTopic=true,ContentBasedDeduplication=true \
        --region $REGION

      echo "Creating ${CHAIN_NAME} backup SQS FIFO queues..."
      $AWS sqs create-queue \
        --queue-name "stl-${CHAIN_NAME}-backup-dlq.fifo" \
        --attributes FifoQueue=true,ContentBasedDeduplication=true \
        --region $REGION

      $AWS sqs create-queue \
        --queue-name "stl-${CHAIN_NAME}-backup.fifo" \
        --attributes FifoQueue=true,ContentBasedDeduplication=true \
        --region $REGION

      echo "Subscribing ${CHAIN_NAME} backup queue to topic..."
      $AWS sns subscribe \
        --topic-arn "arn:aws:sns:${REGION}:${ACCOUNT_ID}:stl-${CHAIN_NAME}-blocks.fifo" \
        --protocol sqs \
        --notification-endpoint "arn:aws:sqs:${REGION}:${ACCOUNT_ID}:stl-${CHAIN_NAME}-backup.fifo" \
        --attributes RawMessageDelivery=true \
        --region $REGION

      echo "Creating ${CHAIN_NAME} raw-block S3 bucket..."
      $AWS s3 mb "s3://stl-sentinel${DEPLOY_ENV}-${CHAIN_NAME}-raw" --region $REGION
    }

    # Helper: create a consumer queue (with DLQ) subscribed to a chain's SNS topic.
    # Mirrors the helper in localstack-init/init-aws.sh; keep the two in sync.
    create_consumer_queue() {
      local CHAIN_NAME=$1
      local QUEUE_NAME=$2

      echo "Creating ${CHAIN_NAME} ${QUEUE_NAME} queues..."
      $AWS sqs create-queue \
        --queue-name "stl-${CHAIN_NAME}-${QUEUE_NAME}-dlq.fifo" \
        --attributes FifoQueue=true,ContentBasedDeduplication=true \
        --region $REGION

      $AWS sqs create-queue \
        --queue-name "stl-${CHAIN_NAME}-${QUEUE_NAME}.fifo" \
        --attributes FifoQueue=true,ContentBasedDeduplication=true \
        --region $REGION

      $AWS sns subscribe \
        --topic-arn "arn:aws:sns:${REGION}:${ACCOUNT_ID}:stl-${CHAIN_NAME}-blocks.fifo" \
        --protocol sqs \
        --notification-endpoint "arn:aws:sqs:${REGION}:${ACCOUNT_ID}:stl-${CHAIN_NAME}-${QUEUE_NAME}.fifo" \
        --attributes RawMessageDelivery=true \
        --region $REGION
    }

    # Create resources for each supported chain
    create_chain_resources "ethereum"
    create_chain_resources "avalanche"
    create_chain_resources "base"
    create_chain_resources "optimism"
    create_chain_resources "unichain"
    create_chain_resources "arbitrum"
    create_chain_resources "robinhood"

    echo "Creating oracle price queues..."
    $AWS sqs create-queue \
      --queue-name stl-ethereum-oracle-price-dlq.fifo \
      --attributes FifoQueue=true,ContentBasedDeduplication=true \
      --region $REGION

    $AWS sqs create-queue \
      --queue-name stl-ethereum-oracle-price.fifo \
      --attributes FifoQueue=true,ContentBasedDeduplication=true \
      --region $REGION

    $AWS sns subscribe \
      --topic-arn "arn:aws:sns:${REGION}:${ACCOUNT_ID}:stl-ethereum-blocks.fifo" \
      --protocol sqs \
      --notification-endpoint "arn:aws:sqs:${REGION}:${ACCOUNT_ID}:stl-ethereum-oracle-price.fifo" \
      --attributes RawMessageDelivery=true \
      --region $REGION

    $AWS sqs create-queue \
      --queue-name stl-avalanche-oracle-price-dlq.fifo \
      --attributes FifoQueue=true,ContentBasedDeduplication=true \
      --region $REGION

    $AWS sqs create-queue \
      --queue-name stl-avalanche-oracle-price.fifo \
      --attributes FifoQueue=true,ContentBasedDeduplication=true \
      --region $REGION

    $AWS sns subscribe \
      --topic-arn "arn:aws:sns:${REGION}:${ACCOUNT_ID}:stl-avalanche-blocks.fifo" \
      --protocol sqs \
      --notification-endpoint "arn:aws:sqs:${REGION}:${ACCOUNT_ID}:stl-avalanche-oracle-price.fifo" \
      --attributes RawMessageDelivery=true \
      --region $REGION

    # SparkLend position tracker is Ethereum-only
    echo "Creating Ethereum sparklend position queues..."
    $AWS sqs create-queue \
      --queue-name stl-ethereum-sparklend-position-dlq.fifo \
      --attributes FifoQueue=true,ContentBasedDeduplication=true \
      --region $REGION

    $AWS sqs create-queue \
      --queue-name stl-ethereum-sparklend-position.fifo \
      --attributes FifoQueue=true,ContentBasedDeduplication=true \
      --region $REGION

    $AWS sns subscribe \
      --topic-arn "arn:aws:sns:${REGION}:${ACCOUNT_ID}:stl-ethereum-blocks.fifo" \
      --protocol sqs \
      --notification-endpoint "arn:aws:sqs:${REGION}:${ACCOUNT_ID}:stl-ethereum-sparklend-position.fifo" \
      --attributes RawMessageDelivery=true \
      --region $REGION

    # Morpho indexer is Ethereum-only
    echo "Creating Ethereum morpho indexing queues..."
    $AWS sqs create-queue \
      --queue-name stl-ethereum-morpho-indexing-dlq.fifo \
      --attributes FifoQueue=true,ContentBasedDeduplication=true \
      --region $REGION

    $AWS sqs create-queue \
      --queue-name stl-ethereum-morpho-indexing.fifo \
      --attributes FifoQueue=true,ContentBasedDeduplication=true \
      --region $REGION

    $AWS sns subscribe \
      --topic-arn "arn:aws:sns:${REGION}:${ACCOUNT_ID}:stl-ethereum-blocks.fifo" \
      --protocol sqs \
      --notification-endpoint "arn:aws:sqs:${REGION}:${ACCOUNT_ID}:stl-ethereum-morpho-indexing.fifo" \
      --attributes RawMessageDelivery=true \
      --region $REGION

    # Prime debt indexer is Ethereum-only
    echo "Creating Ethereum prime-debt queues..."
    $AWS sqs create-queue \
      --queue-name stl-ethereum-prime-debt-dlq.fifo \
      --attributes FifoQueue=true,ContentBasedDeduplication=true \
      --region $REGION

    $AWS sqs create-queue \
      --queue-name stl-ethereum-prime-debt.fifo \
      --attributes FifoQueue=true,ContentBasedDeduplication=true \
      --region $REGION

    $AWS sns subscribe \
      --topic-arn "arn:aws:sns:${REGION}:${ACCOUNT_ID}:stl-ethereum-blocks.fifo" \
      --protocol sqs \
      --notification-endpoint "arn:aws:sqs:${REGION}:${ACCOUNT_ID}:stl-ethereum-prime-debt.fifo" \
      --attributes RawMessageDelivery=true \
      --region $REGION

    # Allocation tracker runs on Ethereum and Robinhood
    create_consumer_queue "robinhood" "allocation-tracker"

    echo "Creating Ethereum allocation-tracker queues..."
    $AWS sqs create-queue \
      --queue-name stl-ethereum-allocation-tracker-dlq.fifo \
      --attributes FifoQueue=true,ContentBasedDeduplication=true \
      --region $REGION

    $AWS sqs create-queue \
      --queue-name stl-ethereum-allocation-tracker.fifo \
      --attributes FifoQueue=true,ContentBasedDeduplication=true \
      --region $REGION

    $AWS sns subscribe \
      --topic-arn "arn:aws:sns:${REGION}:${ACCOUNT_ID}:stl-ethereum-blocks.fifo" \
      --protocol sqs \
      --notification-endpoint "arn:aws:sqs:${REGION}:${ACCOUNT_ID}:stl-ethereum-allocation-tracker.fifo" \
      --attributes RawMessageDelivery=true \
      --region $REGION

    # PSM3 indexer runs on the four L2 chains
    for chain in base optimism unichain arbitrum; do
      create_consumer_queue "$chain" "psm3-indexer"
    done

    # DEX indexers (shared dex-indexer image, one Deployment per DEX) are
    # Ethereum-only. Local convention stl-<chain>-<queue>.fifo — no
    # sentinel<env> segment, unlike the EKS queues.
    for queue in curve-indexing uniswap-v3-indexing uniswap-v4-indexing; do
      create_consumer_queue "ethereum" "$queue"
    done

    # Per-chain raw-block buckets are created by create_chain_resources above.
    echo "Creating stress-test S3 bucket..."
    $AWS s3 mb s3://stress-test-data --region $REGION

    echo "=== LocalStack initialization complete ==="
    echo ""
    echo "SNS Topics:"
    $AWS sns list-topics --region $REGION --query 'Topics[].TopicArn' --output table
    echo ""
    echo "SQS Queues:"
    $AWS sqs list-queues --region $REGION --query 'QueueUrls' --output table
    echo ""
    echo "S3 Buckets:"
    $AWS s3 ls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
      annotations:
        # Substituted by `make kind-infra` with a hash of this file, so the pod
        # (and therefore init-aws.sh, which only runs at container start) is
        # re-run whenever the inlined init script changes.
        stl.dev/localstack-manifest-sha: "__LOCALSTACK_MANIFEST_SHA__"
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:4.3
          env:
            - name: SERVICES
              value: sns,sqs,s3
            # Raw-block bucket names are derived per chain from this value; see
            # the init script's create_chain_resources helper.
            - name: DEPLOY_ENV
              valueFrom:
                configMapKeyRef:
                  name: stl-config
                  key: DEPLOY_ENV
          ports:
            - containerPort: 4566
          volumeMounts:
            - name: init-scripts
              mountPath: /etc/localstack/init/ready.d/init-aws.sh
              subPath: init-aws.sh
      volumes:
        - name: init-scripts
          configMap:
            name: localstack-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
spec:
  type: NodePort
  selector:
    app: localstack
  ports:
    - port: 4566
      targetPort: 4566
      nodePort: 30566

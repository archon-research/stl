apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
      annotations:
        # Substituted by `make kind-infra` with a hash of this file *and* of
        # stl-verify/localstack-init/init-aws.sh (the canonical script the
        # localstack-init ConfigMap is generated from), so the pod — and
        # therefore init-aws.sh, which only runs at container start — is re-run
        # whenever either changes.
        stl.dev/localstack-manifest-sha: "__LOCALSTACK_MANIFEST_SHA__"
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:4.3
          env:
            - name: SERVICES
              value: sns,sqs,s3
            # Raw-block bucket names are derived per chain from this value; see
            # the init script's create_chain_resources helper.
            - name: DEPLOY_ENV
              valueFrom:
                configMapKeyRef:
                  name: stl-config
                  key: DEPLOY_ENV
          ports:
            - containerPort: 4566
          volumeMounts:
            - name: init-scripts
              mountPath: /etc/localstack/init/ready.d/init-aws.sh
              subPath: init-aws.sh
          # ready.d runs after LocalStack is already serving, so without this the
          # `make kind-infra` rollout-status gate opens before init-aws.sh finishes.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: init-scripts
          configMap:
            name: localstack-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
spec:
  type: NodePort
  selector:
    app: localstack
  ports:
    - port: 4566
      targetPort: 4566
      nodePort: 30566

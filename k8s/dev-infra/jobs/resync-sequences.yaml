# LOCAL DEV ONLY (ARCT-399). Fast-forwards every column-owned sequence past
# max(column) after rows have been bulk-imported into the kind dev database with
# explicit ids (a staging clone), which leaves the sequences behind and makes
# the next genuinely-new INSERT fail on the primary key.
#
# The SQL lives in ../sql/resync-sequences.sql and reaches the pod through the
# `resync-sequences-sql` ConfigMap, which `make kind-resync-sequences` creates
# from that file — apply this Job through that target, not by hand, or the pod
# parks on a missing mount.
#
# Deliberately NOT a migration: staging and prod take their ids only from the
# sequence and must never run this (see stl-verify/db/migrations/AGENTS.md).
apiVersion: batch/v1
kind: Job
metadata:
  name: resync-sequences
spec:
  # Every failure mode here is deterministic (a SQL error, a bad mount), and the
  # one transient case — the database not being up — is the initContainer's job.
  # Retrying would only delay the real error.
  backoffLimit: 0
  # Give the Job a Failed condition ahead of the Makefile's 300s wait, so a pod
  # stuck on a missing ConfigMap surfaces as a failure rather than a timeout.
  activeDeadlineSeconds: 240
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h timescaledb -U postgres; do echo "waiting for timescaledb..."; sleep 2; done
      containers:
        - name: resync-sequences
          image: postgres:16-alpine
          # Kubernetes expands $(ADMIN_DATABASE_URL) from the container's env.
          command: ["psql", "$(ADMIN_DATABASE_URL)", "-v", "ON_ERROR_STOP=1", "-f", "/sql/resync-sequences.sql"]
          env:
            # The superuser URL, matching bootstrap-db: setval() needs USAGE or
            # UPDATE on every sequence regardless of who owns it.
            - name: ADMIN_DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: stl-config
                  key: DATABASE_URL
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: resync-sequences-sql

apiVersion: v1
kind: ConfigMap
metadata:
  name: python-api-config
data:
  ENVIRONMENT: "sentinelprod"
  DEPLOY_ENV: "prod"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_SERVICE_NAME: "stl-verify-python-api"
  # DB pool for the API, declared here rather than left baked into the image so it
  # can be tuned by editing config and restarting — this ConfigMap is consumed via
  # envFrom with no hash suffix. A prime-scoped risk-capital request opens
  # connections in proportion to positions x ALM proxies: the ceiling decides when
  # a replica saturates, and the timeout decides what happens next — a queued
  # caller fails fast instead of holding a worker for SQLAlchemy's unset 30s and
  # dragging down endpoints that never touch this pool. VEC-532 bounds the fan-out
  # itself.
  # Held at 5 + 10 until it does: at 10 + 20 the fan-out's decompressing backends
  # exhausted the 8 GiB TigerData primary on 2026-08-13, failing every client's
  # queries with `out of memory` for four minutes.
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "10"
  DB_POOL_TIMEOUT: "10"
  # Recycle retires connections poisoned by a pooler incident that the app's
  # disconnect handling misses; the statement cache must stay 0 behind a
  # transaction-mode pooler (see app/config.py). Declared here, like the pool
  # values above, so an operator can tune them without a rebuild.
  DB_POOL_RECYCLE_SECONDS: "300"
  DB_STATEMENT_CACHE_SIZE: "0"

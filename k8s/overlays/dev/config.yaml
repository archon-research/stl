apiVersion: v1
kind: ConfigMap
metadata:
  name: stl-config
data:
  CHAIN_ID: "1"
  AWS_REGION: us-east-1
  AWS_SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:stl-ethereum-blocks.fifo
  AWS_SNS_ENDPOINT: http://localstack:4566
  AWS_SQS_ENDPOINT: http://localstack:4566
  AWS_S3_ENDPOINT: http://localstack:4566
  # Ethereum default (CHAIN_ID above). Workers validate S3_BUCKET against their
  # own CHAIN_ID, so any deployment that overrides CHAIN_ID must also override
  # S3_BUCKET with stl-sentineldevelopment-{chain}-raw — localstack creates a
  # bucket for every chain it wires up.
  S3_BUCKET: stl-sentineldevelopment-ethereum-raw
  DATABASE_URL: postgres://postgres:postgres@timescaledb:5432/stl_verify?sslmode=disable
  MIGRATOR_DATABASE_URL: postgres://stl_migrator:localdev@timescaledb:5432/stl_verify?sslmode=disable
  REDIS_ADDR: redis:6379
  JAEGER_ENDPOINT: jaeger:4317
  ENVIRONMENT: development
  DEPLOY_ENV: development
  ALCHEMY_HTTP_URL: https://eth-mainnet.g.alchemy.com/v2
  ALCHEMY_WS_URL: wss://eth-mainnet.g.alchemy.com/v2
  ENABLE_BACKFILL: "false"
  TEMPORAL_HOST_PORT: temporal-server.temporal:7233
  TEMPORAL_NAMESPACE: vector
  # Risk-capital root, without the /primes route the client appends itself.
  SKY_RISK_CAPITAL_URL: "https://info-sky.blockanalitica.com/star-monitoring/risk-capital"
  SKY_DATA_URL: "https://sky.data.blockanalitica.com/internal"
  CAPITAL_STACK_SYNC_INTERVAL: "15m"
  ANCHORAGE_API_URL: "https://api.anchorage.com"
  ANCHORAGE_PRIME: "spark"

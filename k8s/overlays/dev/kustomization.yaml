apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local kind overlay (core pipeline). Reuses the same k8s/base manifests as
# overlays/prod and overlays/staging; the runtime component swaps config
# sourcing and image pull policy for local dev. Workers live in ./workers so
# the Makefile can apply them only when an Alchemy API key is present;
# watcher-data-validator lives in ./data-validator for the same reason (it
# verifies against real Etherscan, which is meaningless on mock chain data).
namespace: vector

resources:
  - ../../base/watcher
  - ../../base/python-api
  - ../../base/spark-anchorage-indexer
  - ../../base/offchain-price-indexer
  - ../../base/reference-capital-indexer
  - ../../base/morpho-v2-bootstrap
  - ../../base/core-model-runner
  - config.yaml

components:
  - components/runtime

images:
  - name: watcher
    newName: localhost/stl-watcher
    newTag: local
  - name: python-api
    newName: localhost/stl-python-api
    newTag: local
  # Cronjobs (Temporal workers). Base names spark-anchorage-indexer; the local
  # binary/image is stl-anchorage-indexer (cmd/cronjobs/anchorage-indexer).
  - name: spark-anchorage-indexer
    newName: localhost/stl-anchorage-indexer
    newTag: local
  - name: offchain-price-indexer
    newName: localhost/stl-offchain-price-indexer
    newTag: local
  - name: reference-capital-indexer
    newName: localhost/stl-reference-capital-indexer
    newTag: local
  # On-demand: registers no schedule and idles on its task queue until a run is
  # started, so having it in dev-up costs nothing but proves the wiring.
  - name: morpho-v2-bootstrap
    newName: localhost/stl-morpho-v2-bootstrap
    newTag: local
  # Not its own image: the runner is a Python entry point inside python-api.
  - name: core-model-runner
    newName: localhost/stl-python-api
    newTag: local

patches:
  # Default the watcher to the in-cluster mock blockchain server. Explicit env
  # overrides the eth-mainnet ALCHEMY_* values from stl-config. `make
  # kind-use-alchemy` strips these to fall back to real Alchemy.
  - path: patches/watcher-mock.yaml
  # Local kind runs a single python-api replica (base defaults to 2 for prod/staging).
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: python-api
      spec:
        replicas: 1
  # Local kind indexes no positions, oracle prices or CEX books, so force the
  # core model back to its parquet snapshots. market_configs.json flips
  # SparkLend to live sources for real environments; these env vars are the
  # documented global override.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: core-model-runner
      spec:
        template:
          spec:
            containers:
              - name: core-model-runner
                env:
                  - name: CORE_MODEL_POSITION_SOURCE
                    value: parquet
                  - name: CORE_MODEL_PRICE_SOURCE
                    value: parquet
                  - name: CORE_MODEL_ORDERBOOK_SOURCE
                    value: parquet
  # Drop the base PodDisruptionBudget: against the single replica above,
  # minAvailable: 1 is maxUnavailable: 0 and blocks every voluntary eviction,
  # so `kubectl drain` on the one kind node would hang. Nothing consolidates a
  # local cluster, so there is no disruption to budget for. VEC-531.
  - patch: |
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: python-api
      $patch: delete
  # Local kind runs the model on stale parquet snapshots, so the daily tick has
  # no statistical value -- the N_MC=10000 default would grind for hours (and
  # peak ~8 GiB) to produce numbers nobody reads. 100 scenarios keep the tick
  # minutes-long and still exercise the whole pipeline. Staging pins the same
  # cap in its ConfigMap until the live readers land (VEC-272 PR 3).
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: core-model-runner
      spec:
        template:
          spec:
            containers:
              - name: core-model-runner
                env:
                  - name: CORE_MODEL_N_MC
                    value: "100"

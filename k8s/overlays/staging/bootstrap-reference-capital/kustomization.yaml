# Manual-apply overlay for the one-off reference-capital-backfill Job.
# NOT referenced by ../kustomization.yaml, so ArgoCD never syncs or auto-runs it.
# Run once, by hand, after reference-capital-indexer is deployed (the Job reuses its
# ConfigMap and Secret):
#   kustomize build k8s/overlays/staging/bootstrap-reference-capital | kubectl apply -f -
# Set newTag to a cronjob image that has actually been built and pushed — check with
#   aws ecr list-images --repository-name <repo> --query 'imageIds[?starts_with(imageTag, `reference-capital-backfill`)].imageTag'
# A tag for a branch SHA whose image was never pushed leaves the Job in ImagePullBackOff.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vector

resources:
  - ../../../base/reference-capital-backfill

images:
  - name: reference-capital-backfill
    newName: 579039992622.dkr.ecr.eu-west-1.amazonaws.com/stl-sentinelstaging-cronjob
    newTag: "reference-capital-backfill-2e910b76c4f0d0ac3335b310976c4ee28e8a427b"

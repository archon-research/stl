# Manual-apply overlay for the one-off uniswap-v4-position-bootstrap Job (VEC-639).
# NOT referenced by ../kustomization.yaml, so ArgoCD never syncs or auto-runs it.
# Run by hand after the uniswap-v4-indexer's first deploy on the chain, and after
# any suspected position gap — docs/runbooks/vector-indexers.md#uniswap-v4-indexer-vec-475:
#   kustomize build k8s/overlays/staging/uniswap-v4-position-bootstrap | kubectl apply -f -
# Set newTag to a uniswap-v4-position-bootstrap-<sha> tag the pipeline has built
# (the roster promotes it with every deploy); the placeholder below fails to pull.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vector

resources:
  - ../../../base/uniswap-v4-position-bootstrap

# To resume a failed run at its pin (or tune a window), uncomment and set:
# patches:
#   - target: {kind: Job, name: uniswap-v4-position-bootstrap}
#     patch: |-
#       - op: replace
#         path: /spec/template/spec/containers/0/env/0/value
#         value: "25946281"   # PIN_BLOCK; env/1 is FROM_BLOCK, see the base Job
#
images:
  - name: uniswap-v4-position-bootstrap
    newName: 579039992622.dkr.ecr.eu-west-1.amazonaws.com/stl-sentinelstaging-cronjob
    newTag: "uniswap-v4-position-bootstrap-SET-ME-TO-A-BUILT-SHA"

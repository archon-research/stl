# On-demand Morpho vault backfill worker (VEC-218). ALCHEMY_HTTP_URL is omitted:
# the binary defaults to eth-mainnet, matching CHAIN_ID below. The bucket is not
# here — it carries a random suffix and so arrives via the ExternalSecret.
#
# OTEL_EXPORTER_OTLP_ENDPOINT below only duplicates the value this Deployment
# already gets from otel-config — it is redundant, not load-bearing.
apiVersion: v1
kind: ConfigMap
metadata:

# The three L2 trackers immediately below (ARCT-216) set SWEEP_BLOCKS because the 75-block
# default is block-count based: at these chains' cadences it would re-read and
# append every tracked position every ~19s (arbitrum) to ~150s (optimism). The
# values normalise the sweep to ~10 minutes, matching the psm3-indexer configmaps
# for the same chains.
apiVersion: v1
kind: ConfigMap
metadata:
  name: optimism-allocation-tracker-config
data:
  AWS_REGION: "eu-west-1"
  ALCHEMY_HTTP_URL: "https://opt-mainnet.g.alchemy.com/v2"
  DEPLOY_ENV: "staging"
  CHAIN_ID: "10"
  ENVIRONMENT: "sentinelstaging"
  SWEEP_BLOCKS: "300"
  # Raw SC call archiving (VEC-81). Single bucket shared across chains;
  # pod identity write policy granted in infrastructure#383.
  ARCHIVE_SC_CALLS: "true"
  RAW_SC_BUCKET: "stl-sentinelstaging-raw-sc-calls"

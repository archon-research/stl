# On-demand block republisher (ARCT-383) — see docs/runbooks/vector-cronjobs.md.
# AWS_SNS_TOPIC_ARN and REDIS_ADDR arrive via the ExternalSecret, the same
# infra-config values the ethereum watcher publishes with.
# DEPLOY_ENV is what the startup guard validates that topic's chain against.
apiVersion: v1
kind: ConfigMap
metadata:
  name: block-republisher
data:
  TEMPORAL_HOST_PORT: "temporal-server.temporal:7233"
  TEMPORAL_NAMESPACE: "vector"
  CHAIN_ID: "1"
  # Required, not defaulted: a deployment without it would fetch another chain's
  # blocks for its heights. The value is the ethereum watcher's own.
  ALCHEMY_HTTP_URL: "https://eth-mainnet.g.alchemy.com/v2"
  AWS_REGION: "eu-west-1"
  AWS_SNS_ENDPOINT: "https://sns.eu-west-1.amazonaws.com"
  DEPLOY_ENV: "staging"
---
# CEX order book indexer — Coinbase. OKX/Kraken get their own configmaps with the
# venue-specific EXCHANGE and SYMBOLS (OKX uses dash pairs like BTC-USDT; Kraken
# uses slash pairs with its own asset names like XBT/USD).
# All six symbols verified online and tradeable against the Coinbase products API
# on 2026-08-24; the model's other ten tokens are not listed on Coinbase at all.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cex-orderbook-indexer-coinbase-config
data:
  EXCHANGE: "coinbase"
  SYMBOLS: "BTC-USD,ETH-USD,XRP-USD,SOL-USD,HYPE-USD,JITOSOL-USD"
  ORDERBOOK_DEPTH: "100"
  ORDERBOOK_INTERVAL: "5s"
  ENVIRONMENT: "sentinelstaging"
---
# OKX uses dash-separated instrument ids. All six are quoted in USDT: JITOSOL has
# no other book, so USDT keeps one quote across the set. Verified live against the
# OKX SPOT instruments API on 2026-08-24; the model's other ten tokens are not
# listed at all. Merging these USDT books into the model's USD depth curve ignores
# the basis — VEC-458 owns that decision.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cex-orderbook-indexer-okx-config
data:
  EXCHANGE: "okx"
  SYMBOLS: "BTC-USDT,ETH-USDT,XRP-USDT,SOL-USDT,HYPE-USDT,JITOSOL-USDT"
  ORDERBOOK_DEPTH: "100"
  ORDERBOOK_INTERVAL: "5s"
  ENVIRONMENT: "sentinelstaging"
---
# Kraken uses slash-separated pairs with its own asset names (XBT, not BTC), so
# each entry is the exact "wsname" string from the AssetPairs API rather than one
# built by convention. All seven verified live on 2026-08-24 and USD-quoted, so
# the books merge with Coinbase's without a basis adjustment. TBTC/USD is listed
# but excluded: 621bps spread and no resting size within 2% of mid. The model's
# remaining eight tokens are not listed on Kraken at all.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cex-orderbook-indexer-kraken-config
data:
  EXCHANGE: "kraken"
  SYMBOLS: "XBT/USD,ETH/USD,XRP/USD,SOL/USD,HYPE/USD,JITOSOL/USD,WBTC/USD"
  ORDERBOOK_DEPTH: "100"
  ORDERBOOK_INTERVAL: "5s"
  ENVIRONMENT: "sentinelstaging"

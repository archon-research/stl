apiVersion: v1
kind: ConfigMap
metadata:
  name: python-api-config
data:
  ENVIRONMENT: "sentinelstaging"
  DEPLOY_ENV: "staging"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_SERVICE_NAME: "stl-verify-python-api"
  # DB pool for the API, declared here rather than left baked into the image so it
  # can be tuned by editing config and restarting — this ConfigMap is consumed via
  # envFrom with no hash suffix. A prime-scoped risk-capital request opens
  # connections in proportion to positions x ALM proxies: the ceiling decides when
  # a replica saturates, and the timeout decides what happens next — a queued
  # caller fails fast instead of holding a worker for SQLAlchemy's unset 30s and
  # dragging down endpoints that never touch this pool. VEC-532 bounds the fan-out
  # itself.
  # Pool size matches prod, where 10 + 20 exhausted the TigerData primary on
  # 2026-08-13; overflow is held below prod's 10 because staging's pooler also
  # OOMs intermittently on the source=both crypto-lending prefetch, and each
  # such request holds two connections concurrently.
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "5"
  DB_POOL_TIMEOUT: "10"
  # Recycle + statement-cache settings exist for the same pooler incidents: the
  # recycle retires poisoned connections the disconnect handling misses, and the
  # cache must stay 0 behind a transaction-mode pooler (see app/config.py).
  DB_POOL_RECYCLE_SECONDS: "300"
  DB_STATEMENT_CACHE_SIZE: "0"
---

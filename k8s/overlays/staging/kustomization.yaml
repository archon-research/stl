  # its task queue until a run is started by hand from the Temporal UI.
  - ../../base/offchain-price-backfill
  - ../../base/maple-graphql-indexer
  # CEX L2 order book indexer fleet — one pod per exchange, same binary,
  # different EXCHANGE/SYMBOLS config (OKX/Kraken added by copying the coinbase
  # base dir + its configmap/external-secret with the exchange-specific values).
  - ../../base/cex-orderbook-indexer-coinbase

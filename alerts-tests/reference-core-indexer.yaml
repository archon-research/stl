# Unit tests for the reference-core-indexer rules (VEC-828): the `unless`
# absence shape on WritesZero, the one-stale-cycle-must-not-page window on
# StaleUpstream, the plain-table growth tripwire, and the Deployment-name regex
# that VectorCronjobWorkerDown keys on.
#
# The job ticks every 30m. Series step at 1m, so a "cycle" is 30 samples.
rule_files:
  - ../alerts/vector-cronjobs.yaml

evaluation_interval: 1m

tests:
  - name: "writes-zero: cycling with nothing written fires"
    interval: 1m
    input_series:
      - series: 'cronjob_runs_total{service_name="reference-core-indexer", status="success", k8s_namespace_name="vector", cluster="c1"}'
        values: '0+1x300'
      - series: 'reference_core_sync_markets_written_total{k8s_namespace_name="vector", cluster="c1"}'
        values: '0x300'
    alert_rule_test:
      - eval_time: 5h
        alertname: VectorReferenceCoreIndexerWritesZero
        exp_alerts:
          - exp_labels:
              cluster: "c1"
              component: "reference-core-indexer"
              namespace: "vector"
              severity: "warning"
              team: "vector"
            exp_annotations: &writes_zero
              description: |
                `reference_core_market_result` received 0 rows over 3h while cycles
                succeeded. The CORE reference series has stopped advancing, and any
                day that passes unobserved cannot be recovered afterwards — the
                dashboard publishes no history route.
              runbook_url: "https://github.com/archon-research/stl/blob/main/docs/runbooks/vector-cronjobs.md#vectorreferencecoreindexerwriteszero"
              summary: "Vector reference-core-indexer wrote 0 CORE reference rows"

  # `unless` fires on an absent series too: a collector drop or a metric rename
  # must not read as healthy.
  - name: "writes-zero: cycling with the written counter absent fires"
    interval: 1m
    input_series:
      - series: 'cronjob_runs_total{service_name="reference-core-indexer", status="success", k8s_namespace_name="vector", cluster="c1"}'
        values: '0+1x300'
    alert_rule_test:
      - eval_time: 5h
        alertname: VectorReferenceCoreIndexerWritesZero
        exp_alerts:
          - exp_labels:
              cluster: "c1"
              component: "reference-core-indexer"
              namespace: "vector"
              severity: "warning"
              team: "vector"
            exp_annotations: *writes_zero

  - name: "writes-zero: rows landing every cycle stays quiet"
    interval: 1m
    input_series:
      - series: 'cronjob_runs_total{service_name="reference-core-indexer", status="success", k8s_namespace_name="vector", cluster="c1"}'
        values: '0+1x300'
      - series: 'reference_core_sync_markets_written_total{k8s_namespace_name="vector", cluster="c1"}'
        values: '0x29 32x30 64x30 96x30 128x30 160x30 192x30 224x30 256x30 288x30 320x1'
    alert_rule_test:
      - eval_time: 5h
        alertname: VectorReferenceCoreIndexerWritesZero
        exp_alerts: []

  # Gated on "cycling": a worker that is simply down is VectorCronjobWorkerDown's.
  - name: "writes-zero: no cycles at all stays quiet"
    interval: 1m
    input_series:
      - series: 'cronjob_runs_total{service_name="reference-core-indexer", status="success", k8s_namespace_name="vector", cluster="c1"}'
        values: '0x300'
      - series: 'reference_core_sync_markets_written_total{k8s_namespace_name="vector", cluster="c1"}'
        values: '0x300'
    alert_rule_test:
      - eval_time: 5h
        alertname: VectorReferenceCoreIndexerWritesZero
        exp_alerts: []

  # One late upstream run: a single stale cycle keeps increase()[1h] above zero
  # for under an hour, so `for: 2h` never elapses.
  - name: "stale-upstream: one stale cycle stays quiet"
    interval: 1m
    input_series:
      - series: 'reference_core_sync_stale_cycles_total{k8s_namespace_name="vector", cluster="c1"}'
        values: '0x59 1x300'
    alert_rule_test:
      - eval_time: 1h30m
        alertname: VectorReferenceCoreIndexerStaleUpstream
        exp_alerts: []
      - eval_time: 3h
        alertname: VectorReferenceCoreIndexerStaleUpstream
        exp_alerts: []
      - eval_time: 6h
        alertname: VectorReferenceCoreIndexerStaleUpstream
        exp_alerts: []

  # Upstream stuck: every 30m cycle is stale, so the counter steps every cycle.
  - name: "stale-upstream: every cycle stale for two hours fires"
    interval: 1m
    input_series:
      - series: 'reference_core_sync_stale_cycles_total{k8s_namespace_name="vector", cluster="c1"}'
        values: '0x29 1x30 2x30 3x30 4x30 5x30 6x30 7x30 8x30 9x1'
    alert_rule_test:
      - eval_time: 4h30m
        alertname: VectorReferenceCoreIndexerStaleUpstream
        exp_alerts:
          - exp_labels:
              cluster: "c1"
              component: "reference-core-indexer"
              namespace: "vector"
              severity: "warning"
              team: "vector"
            exp_annotations:
              description: |
                For 2h+ every cycle's freshest row carried an upstream `model_date`
                more than a day behind. Block Analitica's CORE model has stopped
                publishing a new day; STL is recording the last one it did publish,
                correctly labelled. Nothing to fix in the service — confirm against
                the dashboard and flag it upstream.
              runbook_url: "https://github.com/archon-research/stl/blob/main/docs/runbooks/vector-cronjobs.md#vectorreferencecoreindexerstaleupstream"
              summary: "Vector reference-core-indexer: upstream CORE results are stale"

  # The budget is 2.9 rows/s over a 6h rate window held for 6h: 180 rows/min
  # combined is 3.0 rows/s and breaches, 168 is 2.8 and does not.
  - name: "growth: the market and vault terms are added and a sustained rate over budget fires"
    interval: 1m
    input_series:
      - series: 'reference_core_sync_markets_written_total{k8s_namespace_name="vector", cluster="c1"}'
        values: '0+90x720'
      - series: 'reference_core_sync_vaults_written_total{k8s_namespace_name="vector", cluster="c1"}'
        values: '0+90x720'
    alert_rule_test:
      - eval_time: 12h
        alertname: VectorReferenceCoreResultGrowthHigh
        exp_alerts:
          - exp_labels:
              cluster: "c1"
              component: "reference-core-indexer"
              namespace: "vector"
              severity: "warning"
              team: "vector"
            exp_annotations:
              description: |
                Combined write rate into `reference_core_market_result` +
                `reference_core_vault_result` has exceeded 250k rows/day (2.9 rows/s)
                sustained for 6h — about 90M rows/year against the ~100M-row budget
                those deliberately-plain (non-hypertable) tables were sized for.
                Nothing is broken; this is the tripwire on that design choice. Check
                the real row counts, and if the rate is the new normal plan the
                hypertable conversion migration described in the runbook.
              runbook_url: "https://github.com/archon-research/stl/blob/main/docs/runbooks/vector-cronjobs.md#vectorreferencecoreresultgrowthhigh"
              summary: "Vector reference_core_* tables outgrowing their plain-table budget"

  - name: "growth: a sustained rate under budget stays quiet"
    interval: 1m
    input_series:
      - series: 'reference_core_sync_markets_written_total{k8s_namespace_name="vector", cluster="c1"}'
        values: '0+84x720'
      - series: 'reference_core_sync_vaults_written_total{k8s_namespace_name="vector", cluster="c1"}'
        values: '0+84x720'
    alert_rule_test:
      - eval_time: 12h
        alertname: VectorReferenceCoreResultGrowthHigh
        exp_alerts: []

  - name: "worker-down: the reference-core-indexer Deployment is in the regex"
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{deployment="reference-core-indexer", namespace="vector", cluster="c1"}'
        values: '0x30'
      - series: 'kube_deployment_spec_replicas{deployment="reference-core-indexer", namespace="vector", cluster="c1"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: VectorCronjobWorkerDown
        exp_alerts:
          - exp_labels:
              cluster: "c1"
              component: "temporal-cronjobs"
              deployment: "reference-core-indexer"
              namespace: "vector"
              severity: "critical"
              team: "vector"
            exp_annotations:
              description: |
                Deployment `reference-core-indexer` has <1 available replica for
                >10m. The Temporal cron worker is not running, so its schedule
                fires with no worker to pick it up and no snapshots/validations are
                produced. Check the pod (CrashLoopBackOff, OOM, image pull) before
                data goes stale.
              runbook_url: "https://github.com/archon-research/stl/blob/main/docs/runbooks/vector-cronjobs.md#vectorcronjobworkerdown"
              summary: "Vector cronjob `reference-core-indexer` has no available replica"

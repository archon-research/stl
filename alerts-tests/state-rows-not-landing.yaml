            exp_annotations: &uniswap_v3_not_landing
              description: |
                `uniswap-v3-indexer` on chain `mainnet` has queued state
                rows for over an hour and none of them was inserted. Either every
                row is conflicting away — a same-build replay of an already-indexed
                range, which is benign and ends when the replay does — or rows are
                being dropped silently, which is the VEC-615 compressed-chunk drop
                or a regression in the same place. Check the pod logs for a replay

        values: '0+5x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: VectorUniswapV3IndexerStateRowsNotLanding
        exp_alerts: []

  - name: "uniswap_v3: nothing attempted, so nothing is owed"
    interval: 1m
    input_series:

# Lefthook configuration for stl-verify monorepo
# Root config that extends language-specific configs from stl-verify/
# Install: make install-hooks or lefthook install
# Run manually: lefthook run pre-commit

# Globs are matched with gobwas/glob compiled without separators, so `*` spans
# `/` and there is no distinct `**`. Write `dir/**.ext` to mean "any depth";
# `dir/**/*.ext` silently skips files sitting directly in dir/.

# Every `extends` path -- including those inside an extended file -- is resolved
# against the repo root, so they all have to live here to be spelled correctly.
extends:
  - stl-verify/lefthook.yml
  - stl-verify/python/lefthook.yml
  - stl-verify/ts/lefthook.yml

# Root-level generic checks
pre-commit:
  parallel: true
  exclude: "bin/**|dist/**"

  commands:
    # Root-level generic file checks
    trailing-whitespace:
      glob: "**/*.{yml,yaml,json,md,sh}"
      exclude: '(stl-verify|lefthook).*'
      stage_fixed: true
      run: perl -i -pe 's/[^\S\n]+$//' {staged_files}

    end-of-file-fixer:
      glob: "**/*.{yml,yaml,json,md,sh}"
      exclude: '(stl-verify|lefthook).*'
      stage_fixed: true
      run: |
        for file in {staged_files}; do
          [ -f "$file" ] || continue
          [ -n "$(tail -c1 "$file")" ] && echo >> "$file"
          perl -i -0pe 's/\n+$/\n/' "$file"
        done

    check-merge-conflict:
      glob: "**/*"
      exclude: "stl-verify/.*"
      run: |
        if grep -r -E '^(<<<<<<<|=======|>>>>>>>)' {staged_files} 2>/dev/null; then
          echo "Error: Merge conflict markers found"
          exit 1
        fi

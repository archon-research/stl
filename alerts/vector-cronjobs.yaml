# =============================================================================
# Vector — Temporal cronjob alerts (ORB-284)
# =============================================================================
# Generic failure alerts for every Temporal cronjob. All cronjobs run the
# shared cronjobWorkflow (stl-verify/internal/adapters/outbound/temporal/) and
# now emit a single instrumented outcome counter from the shared activity path:
#
#   cronjob_runs_total{status="success"|"error"|"canceled"}
#   cronjob_run_duration_seconds_*  (histogram, for dashboards)
#
# "canceled" is a run interrupted by activity-context cancellation — worker
# shutdown during a deploy rollout, or a schedule cancel. Temporal retries the
# run on the new worker, so it is deliberately NOT status="error" and no rule
# here keys on it; before this split, every deploy that landed while a run was
# in flight tripped VectorCronjobRunFailing.
#
# RunCronjob initialises OTel with ServiceName=<cronjob name>, so every series
# carries service_name="anchorage-indexer" | "offchain-price-indexer" | ... .
# Grouping by service_name gives one alert per cronjob — current AND future —
# with no per-job rule wiring. A new cronjob is covered the moment it ships.
#
# Series carry (set by the OTel SDK + gateway resource processor):
#   - service_name="<cronjob name>"   (== CronjobConfig.Name)
#   - k8s_namespace_name="vector"
#   - cluster="archon-prod" | "archon-staging"
# `cluster` is preserved through `sum by (...)` so the Alertmanager Slack
# template's `Cluster:` header is populated. `namespace` is a static rule label
# (mimir-rules-sync lint forbids `cluster`/`env` as static labels but allows it).
#
# Seven services are EXCLUDED from VectorCronjobAllRunsFailing by service_name:
# maple-graphql-indexer, which has richer dedicated rules in
# vector-indexers.yaml (VEC-320); the five on-demand jobs —
# offchain-price-backfill, reference-capital-backfill, morpho-vault-backfill,
# morpho-v2-bootstrap and block-republisher, none of which carries a schedule;
# and core-model-runner, which does carry a schedule but ticks only every 24h with
# no retry (RetryPolicy.maximum_attempts=1) — see VectorCronjobAllRunsFailing
# for why "no successes in an hour" is their healthy state. Every other
# cronjob, including any added later, is covered automatically; the excluded
# ones are covered by VectorCronjobRunFailing (and VectorOnDemandWorkerDown /
# VectorCronjobWorkerDown for availability) instead; core-model-runner also
# gets its own stall rule, VectorCoreModelRunnerStale.
#
# Severity → routing (per the alerting routing spec):
#   critical       → pages, prod #at_stl_prod_alerts / staging
#                    #at_stl_staging_alerts, [CRITICAL], 1h repeat.
#   warning / info → no page, prod #at_stl_alerts / staging
#                    #at_stl_staging_alerts, [WARNING]/[INFO], 4h repeat.
# Per-env routing is automatic via each Mimir tenant's default_webhook_url; no
# `alert_env` label is needed — every rule reads objects in its own tenant.
# =============================================================================
groups:
  - name: vector-cronjobs
    interval: 60s
    rules:
      # -----------------------------------------------------------------------
      # WARNING — a run failed
      # -----------------------------------------------------------------------
      - alert: VectorCronjobRunFailing
        # Any cronjob run returned an error in the last 15m. RecordRun fires
        # once per activity execution, so a transient failure that the retry
        # policy later recovers also lands here — that is intentional for a
        # warning (you want to see flapping). Runs interrupted by worker
        # shutdown land on status="canceled" instead and do not fire this. A
        # sustained, total failure is escalated to a page by
        # VectorCronjobAllRunsFailing below.
        expr: |
          sum by (service_name, cluster) (
            increase(cronjob_runs_total{
              status="error",
              service_name!="maple-graphql-indexer",
              k8s_namespace_name="vector"
            }[15m])
          ) > 0
        for: 0m
        labels:
          team: vector
          severity: warning
          component: temporal-cronjobs
          namespace: vector
        annotations:
          summary: "Vector cronjob `{{ $labels.service_name }}` run failing"
          description: |
            Temporal cronjob `{{ $labels.service_name }}` recorded
            `{{ $value | printf "%.0f" }}` failed run(s) in 15m. Check the pod
            logs and the Temporal UI (vector namespace) for the failed
            execution. If it recovers on retry this is informational; if it
            persists, VectorCronjobAllRunsFailing will page — except for
            on-demand workers, which that rule excludes, so for those this
            warning is the only run-failure signal.
          runbook_url: https://github.com/archon-research/stl/blob/main/docs/runbooks/vector-cronjobs.md#vectorcronjobrunfailing

      # -----------------------------------------------------------------------
      # CRITICAL — every run is failing (worker up, but nothing succeeds)
      # -----------------------------------------------------------------------
      - alert: VectorCronjobAllRunsFailing
        # Errors > 0 AND zero successes over 1h => the job is consistently
        # failing, not flapping.
        #
        # On-demand jobs (temporal.RunWorker: offchain-price-backfill,
        # reference-capital-backfill, morpho-vault-backfill,
        # morpho-v2-bootstrap, block-republisher) are excluded: they run only
        # when a human starts them, so "zero successes in the last hour" is their
        # healthy state and a single failed run is by definition
        # errors=1/successes=0, which would page critical for a run the operator
        # is already watching. They still emit
        # cronjob_runs_total and are covered by the VectorCronjobRunFailing
        # warning above (the right severity) plus VectorOnDemandWorkerDown.
        #
        # core-model-runner (scheduled, but 24h interval with no retry) is
        # excluded for the same reason: one failed tick is errors=1/successes=0
        # for a full day. VectorCronjobRunFailing still warns on it, and
        # VectorCoreModelRunnerStale below is its critical rule.
        #
        # The 1h window spans >=1 cycle for every other covered cronjob — even
        # the slowest of them, watcher-data-validator (1h), and many cycles for
        # the faster ones. Distinct from VectorCronjobWorkerDown: here the
        # worker IS running and emitting metrics, every run just errors.
        expr: |
          (
            sum by (service_name, cluster) (
              increase(cronjob_runs_total{
                status="error",
                service_name!="maple-graphql-indexer",
                service_name!="offchain-price-backfill",
                service_name!="reference-capital-backfill",
                service_name!="morpho-v2-bootstrap",
                service_name!="morpho-vault-backfill",
                service_name!="block-republisher",
                service_name!="core-model-runner",
                k8s_namespace_name="vector"
              }[1h])
            ) > 0
          )
          and
          (
            sum by (service_name, cluster) (
              increase(cronjob_runs_total{
                status="success",
                service_name!="maple-graphql-indexer",
                service_name!="offchain-price-backfill",
                service_name!="reference-capital-backfill",
                service_name!="morpho-v2-bootstrap",
                service_name!="morpho-vault-backfill",
                service_name!="block-republisher",
                service_name!="core-model-runner",
                k8s_namespace_name="vector"
              }[1h])
            ) == 0
          )
        for: 15m
        labels:
          team: vector
          severity: critical
          component: temporal-cronjobs
          namespace: vector
        annotations:
          summary: "Vector cronjob `{{ $labels.service_name }}` failing every run"
          description: |
            Temporal cronjob `{{ $labels.service_name }}` has had zero
            successful runs and at least one failure over the last 1h. Its
            output (TimescaleDB snapshots / validations) is going stale. Triage
            the pod logs and the Temporal UI; if the worker pod itself is gone
            see VectorCronjobWorkerDown.
          runbook_url: https://github.com/archon-research/stl/blob/main/docs/runbooks/vector-cronjobs.md#vectorcronjoballrunsfailing

      # -----------------------------------------------------------------------
      # CRITICAL — the worker isn't running at all (no metrics to read)
      # -----------------------------------------------------------------------
      - alert: VectorCronjobWorkerDown
        # Deployment-availability companion to the metric-based alerts, sourced
        # from kube-state-metrics so it still fires when the OTLP/metrics
        # pipeline is the thing that broke (a dead worker emits no
        # cronjob_runs_total at all, so the metric-based rules above cannot see
        # it). <1 available replica = no worker pod is running, so the schedule
        # fires into the void. Guarded on desired replicas > 0 so a deployment that
        # is intentionally scaled to 0 (e.g. transform-worker before the post-bootstrap
        # enable step) is not reported as down; a real crash keeps desired >= 1.
        #
        # NB: keyed on the kube-state-metrics `deployment` label, NOT the OTel
        # service_name — anchorage-indexer's Deployment is `spark-anchorage-
        # indexer`. maple-graphql-indexer is excluded (it has its own
        # VectorMapleIndexerDown). When a new SCHEDULED cronjob ships, add its
        # Deployment name to both regexes below.
        #
        # On-demand workers (temporal.RunWorker) are deliberately NOT listed here.
        # This rule pages because a dead scheduled worker means ticks are firing
        # into the void and data is going stale. They carry no schedule, so
        # nothing is missed while one is down — only the ability to start a new
        # run. Paging for that would invert the severity, since an actually-failing
        # run reaches only VectorCronjobRunFailing (warning). They are covered by
        # VectorOnDemandWorkerDown below instead.
        expr: |
          (
            max by (cluster, deployment) (
              kube_deployment_status_replicas_available{
                namespace="vector",
                deployment=~"spark-anchorage-indexer|offchain-price-indexer|watcher-data-validator|transform-worker|reference-capital-indexer|core-model-runner"
              }
            ) < 1
          )
          and on (cluster, deployment) (
            max by (cluster, deployment) (
              kube_deployment_spec_replicas{
                namespace="vector",
                deployment=~"spark-anchorage-indexer|offchain-price-indexer|watcher-data-validator|transform-worker|reference-capital-indexer|core-model-runner"
              }
            ) > 0
          )
        for: 10m
        labels:
          team: vector
          severity: critical
          component: temporal-cronjobs
          namespace: vector
        annotations:
          summary: "Vector cronjob `{{ $labels.deployment }}` has no available replica"
          description: |
            Deployment `{{ $labels.deployment }}` has <1 available replica for
            >10m. The Temporal cron worker is not running, so its schedule
            fires with no worker to pick it up and no snapshots/validations are
            produced. Check the pod (CrashLoopBackOff, OOM, image pull) before
            data goes stale.
          runbook_url: https://github.com/archon-research/stl/blob/main/docs/runbooks/vector-cronjobs.md#vectorcronjobworkerdown

      # -----------------------------------------------------------------------
      # WARNING — an on-demand worker is unavailable (nothing is going stale)
      # -----------------------------------------------------------------------
      - alert: VectorOnDemandWorkerDown
        # The availability rule for temporal.RunWorker jobs, split from
        # VectorCronjobWorkerDown because the impact is categorically different:
        # these carry no schedule, so a dead pod misses no ticks and produces no
        # stale data. The only consequence is that a run cannot be STARTED, which
        # is worth a slack message and not a 3am page.
        #
        # Longer `for` than the scheduled rule for the same reason — a rollout or
        # a brief eviction on an idle worker is not worth waking anyone for.
        expr: |
          (
            max by (cluster, deployment) (
              kube_deployment_status_replicas_available{
                namespace="vector",
                deployment=~"offchain-price-backfill|reference-capital-backfill|morpho-v2-bootstrap|morpho-vault-backfill|block-republisher"
              }
            ) < 1
          )
          and on (cluster, deployment) (
            max by (cluster, deployment) (
              kube_deployment_spec_replicas{
                namespace="vector",
                deployment=~"offchain-price-backfill|reference-capital-backfill|morpho-v2-bootstrap|morpho-vault-backfill|block-republisher"
              }
            ) > 0
          )
        for: 30m
        labels:
          team: vector
          severity: warning
          component: temporal-cronjobs
          namespace: vector
        annotations:
          summary: "On-demand worker `{{ $labels.deployment }}` has no available replica"
          description: |
            Deployment `{{ $labels.deployment }}` has <1 available replica for
            >30m. This worker carries no schedule, so nothing is going stale and
            no data is being missed — but no new run can be started until it is
            back. Check the pod (CrashLoopBackOff, OOM, image pull); an
            ImagePullBackOff here usually means the release wiring is missing.
          runbook_url: https://github.com/archon-research/stl/blob/main/docs/runbooks/vector-cronjobs.md#vectorondemandworkerdown

      # -----------------------------------------------------------------------
      # CRITICAL — core-model-runner has not completed a tick in 30h
      # -----------------------------------------------------------------------
      - alert: VectorCoreModelRunnerStale
        # Stall rule for the one scheduled cronjob excluded from
        # VectorCronjobAllRunsFailing. "Completed" = status success OR error: a
        # tick that fails is VectorCronjobRunFailing's business (warning, daily,
        # and one gap-y market fails the whole tick — see run_markets), so
        # counting errors as completions keeps that from escalating into a
        # permanent page. What this rule catches is a tick that leaves no
        # completion at all while the pod stays 1/1 available: a deploy mid-tick
        # (status="canceled", no retry, day lost), a hang (the sync activity
        # never learns of the 4h server-side timeout, so nothing is recorded),
        # or a SIGKILL mid Monte Carlo. The API serves the newest
        # core_model_results row with no age check, so a silent stop means a
        # stale published number.
        #
        # Window: 24h interval + 4h TICK_TIMEOUT + 2h slack, so two healthy
        # completions are at most ~28h apart.
        #
        # The `offset` gate requires the (zero-seeded) success series to have
        # existed a window ago. Without it every cold start pages: the seed is
        # 0 from the first export and the first tick is at the next 00:00 UTC.
        # It gates on the series existing, not on total>0 — a hung tick records
        # nothing, which is exactly what must still fire.
        #
        # Residual: a live pod whose OTLP export dies lets the series
        # staleness-expire; `increase()` then has <2 samples, returns no data,
        # and this rule goes silent. VectorCronjobWorkerDown does not cover it
        # (the pod is 1/1) — see the runbook.
        expr: |
          (
            sum by (cluster) (
              increase(cronjob_runs_total{
                service_name="core-model-runner",
                status=~"success|error",
                k8s_namespace_name="vector"
              }[30h])
            ) == 0
          )
          and on (cluster) (
            sum by (cluster) (
              count_over_time(cronjob_runs_total{
                service_name="core-model-runner",
                status="success",
                k8s_namespace_name="vector"
              }[1h] offset 29h)
            ) > 0
          )
        for: 30m
        labels:
          team: vector
          severity: critical
          component: temporal-cronjobs
          namespace: vector
        annotations:
          summary: "Vector cronjob `core-model-runner` has not completed a tick in 30h"
          description: |
            `core-model-runner` recorded no completed run (success or error) in
            the last 30h (schedule is 24h, a tick may take up to 4h).
            `core_model_results` has stopped advancing while the API keeps
            serving its newest row as the current CRR. The tick was canceled by
            a deploy mid-run (no retry, so the day is lost), hung past its 4h
            timeout without recording anything, or the schedule stopped firing.
            Check the Temporal UI (vector namespace -> Schedules ->
            core-model-runner) and the pod logs; trigger the schedule by hand
            once the cause is fixed.
          runbook_url: https://github.com/archon-research/stl/blob/main/docs/runbooks/vector-cronjobs.md#vectorcoremodelrunnerstale

      # =======================================================================
      # anchorage-indexer (ARCT-229): silent-empty rule
      # =======================================================================
      # The generic rules above key on run OUTCOME, and a poll that fetches zero
      # packages is a successful run. Between 2026-06-16 and 2026-08-19 the
      # Anchorage API answered 200 with an empty package list on every tick;
      # anchorage_package_snapshot stopped growing while $250M of live BTC
      # collateral stayed on the venue, and no rule here moved. Signal (OTel
      # counter, once per poll, 0 included):
      #   anchorage_snapshots_stored_total  (rows written to anchorage_package_snapshot)
      #
      # Anchorage-specific by design: generalising this to every poll-and-store
      # cronjob would mean threading a row count through the shared Runner
      # interface and every cronjob that implements it.

      # -----------------------------------------------------------------------
      # CRITICAL — runs succeed but nothing is being recorded
      # -----------------------------------------------------------------------
      - alert: VectorAnchorageNoSnapshotsStored
        # Gated on "succeeding AND zero" (the VectorMaplePoolWritesZero shape) so
        # it does not restate VectorCronjobAllRunsFailing or
        # VectorCronjobWorkerDown — those cover the cases where the runs
        # themselves stop. 2h spans 8 ticks of the 15m schedule; the venue holds
        # standing collateral, so 8 consecutive empty polls is never legitimate.
        #
        # A genuinely wound-down venue would also hold this firing. That is a
        # decommission decision, not a tuning problem — see the runbook.
        expr: |
          (
            sum by (cluster) (
              increase(cronjob_runs_total{
                service_name="anchorage-indexer",
                status="success",
                k8s_namespace_name="vector"
              }[2h])
            ) > 0
          )
          and
          (
            sum by (cluster) (
              increase(anchorage_snapshots_stored_total{
                service_name="anchorage-indexer",
                k8s_namespace_name="vector"
              }[2h])
            ) == 0
          )
        for: 30m
        labels:
          team: vector
          severity: critical
          component: anchorage-indexer
          namespace: vector
        annotations:
          summary: "Vector anchorage-indexer stored 0 collateral snapshots"
          description: |
            `anchorage-indexer` completed runs over the last 2h but wrote 0 rows
            to `anchorage_package_snapshot`. The Anchorage API is answering 200
            with an empty package list (or every package went inactive), so the
            recorded Spark collateral position is frozen at whatever it last
            saw while the real position keeps moving. Check the pod's
            `fetched packages count=` log line, then the API credential.
          runbook_url: https://github.com/archon-research/stl/blob/main/docs/runbooks/vector-cronjobs.md#vectoranchoragenosnapshotsstored

      # =======================================================================
      # transform-worker (VEC-484): queue-drain and parity rules
      # =======================================================================
      # These live here, not in a vector-transform-worker.yaml, because the
      # rules-sync namespace regex (`namespaces-regex` in
      # .github/workflows/alerts.yml) does not accept a vector-transform-worker
      # namespace, and the sync derives the namespace from the FILENAME — such a
      # file would be silently dropped. The transform-worker cronjob drains a
      # per-source change queue (transformed._pending_<t>) into the transformed
      # hypertables. Generic run-failure and worker-liveness above already cover
      # it (service_name / deployment "transform-worker"); these add the
      # silent-failure cases that path can't see: the worker is up and its runs
      # "succeed", but a source's queue stops draining, or a row reaches neither
      # the transformed table nor the queue. Signals (OTel gauges, once per tick):
      #   transform_queue_oldest_age_seconds{table="<source>"}  (from _queue_status)
      #   transform_parity_drift{table="<source>"}              (from _parity_status)

      # -----------------------------------------------------------------------
      # WARNING — a source's queue is lagging (draining slower than it fills)
      # -----------------------------------------------------------------------
      - alert: VectorTransformQueueLagging
        # Oldest un-drained row for some source is older than 30m for 15m. In
        # steady state the queue drains every tick (default 10m), so a sustained
        # 30m age means that source is falling behind.
        expr: |
          max by (table, cluster) (
            transform_queue_oldest_age_seconds{
              service_name="transform-worker",
              k8s_namespace_name="vector"
            }
          ) > 1800
        for: 15m
        labels:
          team: vector
          severity: warning
          component: transform-worker
          namespace: vector
        annotations:
          summary: "Transform queue for `{{ $labels.table }}` is lagging"
          description: |
            The oldest un-drained row in `transformed._pending_{{ $labels.table }}`
            has been waiting `{{ $value | humanizeDuration }}`. The worker is
            running but this source is not draining each tick. Check the
            transform-worker logs and `transformed._queue_status`; if it keeps
            climbing, VectorTransformQueueStalled will page.
          runbook_url: https://github.com/archon-research/stl/blob/main/docs/runbooks/vector-transform-worker.md#vectortransformqueuelagging

      # -----------------------------------------------------------------------
      # CRITICAL — a source's queue is stalled (transformed layer going stale)
      # -----------------------------------------------------------------------
      - alert: VectorTransformQueueStalled
        # Oldest un-drained row older than 2h for 30m: the transformed table for
        # this source is materially behind raw and not recovering.
        expr: |
          max by (table, cluster) (
            transform_queue_oldest_age_seconds{
              service_name="transform-worker",
              k8s_namespace_name="vector"
            }
          ) > 7200
        for: 30m
        labels:
          team: vector
          severity: critical
          component: transform-worker
          namespace: vector
        annotations:
          summary: "Transform queue for `{{ $labels.table }}` is stalled"
          description: |
            The oldest un-drained row in `transformed._pending_{{ $labels.table }}`
            has been waiting `{{ $value | humanizeDuration }}`. `transformed.{{ $labels.table }}`
            is materially behind raw. The worker is up (else VectorCronjobWorkerDown
            fires), so the drain itself is failing or wedged — check the
            transform-worker error logs and for a stuck `transformed._run_{{ $labels.table }}()`.
          runbook_url: https://github.com/archon-research/stl/blob/main/docs/runbooks/vector-transform-worker.md#vectortransformqueuestalled

      # -----------------------------------------------------------------------
      # WARNING — raw-vs-transformed parity drift (the correctness backstop)
      # -----------------------------------------------------------------------
      - alert: VectorTransformParityDrift
        # drift = raw - transformed - pending, recorded per source each tick from
        # transformed._parity_status. In a consistent snapshot after bootstrap every
        # raw row is either transformed or still queued, so drift is exactly 0. A
        # sustained nonzero value means a row reached neither the transformed table
        # nor the queue -- a trigger gap or a bootstrap miss -- that the stall alert
        # cannot see. Note this is a row-count check: an in-place raw UPDATE changes
        # no count and is NOT caught here (the raw tables are verified INSERT-only, so
        # that should not occur). Warning (not a page) because it is also nonzero
        # during the initial bootstrap; it must read 0 once bootstrap completes, and
        # can be promoted to critical after rollout is stable.
        expr: |
          max by (table, cluster) (
            transform_parity_drift{
              service_name="transform-worker",
              k8s_namespace_name="vector"
            }
          ) != 0
        for: 30m
        labels:
          team: vector
          severity: warning
          component: transform-worker
          namespace: vector
        annotations:
          summary: "Transform parity drift on `{{ $labels.table }}`"
          description: |
            `transformed.{{ $labels.table }}` is out of parity with raw by
            `{{ $value | printf "%.0f" }}` row(s) (raw - transformed - pending). After
            bootstrap this should be 0. A positive value means raw rows never made it
            into the transformed layer or its queue (a trigger gap or a bootstrap
            miss); negative means the transformed table has orphan rows (a raw delete
            or a bug). An in-place raw UPDATE changes no count and is not caught here.
            Check `SELECT * FROM transformed._parity_status WHERE source = '{{ $labels.table }}'`.
          runbook_url: https://github.com/archon-research/stl/blob/main/docs/runbooks/vector-transform-worker.md#vectortransformparitydrift

      # -----------------------------------------------------------------------
      # WARNING — the reference capital series stopped advancing
      # -----------------------------------------------------------------------
      # reference-capital-indexer is the only writer of forward reference capital.
      # Sky's Star monitor publishes no history, so a cycle that records nothing
      # leaves a hole that can never be backfilled — and the read path gap-fills
      # with locf, so a stalled series keeps serving its last value as current.
      # None of the rules below is covered by the generic cronjob rules above:
      # every failure they catch happens on a run that reports success.
      - alert: VectorReferenceCapitalIndexerWritesZero
        # Cycling but persisting nothing. The monitor covers every tracked prime
        # today, so a healthy cycle always writes; zero means it returned an
        # empty-but-successful payload. Gated on "cycling AND zero" so it does
        # not duplicate the worker-down rules when the worker is simply down.
        # `unless` (not `== 0`) also fires when the counter series is entirely
        # absent — a collector drop or metric rename — which `== 0` cannot.
        expr: |
          sum by (cluster) (
            rate(cronjob_runs_total{service_name="reference-capital-indexer", status="success", k8s_namespace_name="vector"}[1h])
          ) > 0
          unless
          sum by (cluster) (
            increase(reference_capital_sync_snapshots_written_total{k8s_namespace_name="vector"}[1h])
          ) > 0
        for: 30m
        labels:
          team: vector
          severity: warning
          component: reference-capital-indexer
          namespace: vector
        annotations:
          summary: "Vector reference-capital-indexer wrote 0 reference snapshots"
          description: |
            `prime_capital_stack` received 0 rows over 1h while cycles succeeded.
            The reference series has stopped advancing, and
            `/v1/primes/{id}/total-capital?reference=true` keeps serving its last
            value as current rather than going null. This history cannot be
            backfilled afterwards — the monitor publishes none.
          runbook_url: https://github.com/archon-research/stl/blob/main/docs/runbooks/vector-cronjobs.md#vectorreferencecapitalindexerwriteszero

      - alert: VectorReferenceCapitalIndexerPrimeUncovered
        # A prime STL tracks that the monitor stopped covering. The cycle still
        # succeeds and still writes every other prime, so neither the error rules
        # nor WritesZero above catch it — only this one prime's series freezes.
        expr: |
          sum by (star, cluster) (
            increase(reference_capital_sync_primes_uncovered_total{k8s_namespace_name="vector"}[1h])
          ) > 0
        for: 30m
        labels:
          team: vector
          severity: warning
          component: reference-capital-indexer
          namespace: vector
        annotations:
          summary: "Vector reference-capital-indexer: prime `{{ $labels.star }}` not covered upstream"
          description: |
            The Star monitor did not report `{{ $labels.star }}` on any cycle in
            the last hour, so its reference series is frozen while every other
            prime advances. Either the monitor dropped the prime, or its name
            drifted from the axis-synome contract STL tracks. Confirm against the
            monitor's `/primes/` route before assuming an outage.
          runbook_url: https://github.com/archon-research/stl/blob/main/docs/runbooks/vector-cronjobs.md#vectorreferencecapitalindexerprimeuncovered

      - alert: VectorReferenceCapitalIndexerAllocationsZero
        # The per-allocation breakdown stalled while cycles succeed. Every row is
        # keyed by the cycle's fresh synced_at, so written == inserted, and a
        # healthy cycle always writes: the service fails a cycle whose covered
        # primes report exposure with no breakdown. Zero therefore means every
        # covered prime reported zero exposure — worth eyes either way.
        # `unless` (not `== 0`) also fires when the counter series is entirely
        # absent — a collector drop or metric rename — which `== 0` cannot.
        expr: |
          sum by (cluster) (
            rate(cronjob_runs_total{service_name="reference-capital-indexer", status="success", k8s_namespace_name="vector"}[1h])
          ) > 0
          unless
          sum by (cluster) (
            increase(reference_capital_sync_allocations_written_total{k8s_namespace_name="vector"}[1h])
          ) > 0
        for: 30m
        labels:
          team: vector
          severity: warning
          component: reference-capital-indexer
          namespace: vector
        annotations:
          summary: "Vector reference-capital-indexer wrote 0 allocation breakdown rows"
          description: |
            `prime_capital_stack_allocation` received 0 rows over 1h while cycles
            succeeded. The per-allocation reference breakdown has stopped
            advancing; like the prime-level series, this history cannot be
            backfilled afterwards — the monitor publishes none.
          runbook_url: https://github.com/archon-research/stl/blob/main/docs/runbooks/vector-cronjobs.md#vectorreferencecapitalindexerallocationszero

      - alert: VectorReferenceCapitalIndexerPositionsZero
        # The positions counter stalled while cycles succeed. A successful cycle
        # always writes at least one row per covered star: Run fails before
        # persisting if snapshots are empty, and the positions client fails the
        # whole cycle on an empty result for a covered prime — so a covered set
        # is never empty when a cycle succeeds. Zero here therefore means the
        # counter itself broke (collector drop, metric rename, missed recording
        # call), not a stalled series.
        # `unless` (not `== 0`) also fires when the counter series is entirely
        # absent, which `== 0` cannot.
        expr: |
          sum by (cluster) (
            rate(cronjob_runs_total{service_name="reference-capital-indexer", status="success", k8s_namespace_name="vector"}[1h])
          ) > 0
          unless
          sum by (cluster) (
            increase(reference_capital_sync_positions_written_total{k8s_namespace_name="vector"}[1h])
          ) > 0
        for: 30m
        labels:
          team: vector
          severity: warning
          component: reference-capital-indexer
          namespace: vector
        annotations:
          summary: "Vector reference-capital-indexer: positions counter stopped moving"
          description: |
            `reference_capital_sync_positions_written_total` recorded 0 over 1h
            while cycles succeeded. A successful cycle always writes at least one
            position row, so this is the counter itself breaking (collector drop,
            metric rename, missed recording call) — confirm against
            `prime_reference_position` before assuming the series stalled.
          runbook_url: https://github.com/archon-research/stl/blob/main/docs/runbooks/vector-cronjobs.md#vectorreferencecapitalindexerpositionszero

      # -----------------------------------------------------------------------
      # WARNING — a prime dropped out of the balance-sheet feed (B6 gap)
      # -----------------------------------------------------------------------
      - alert: VectorReferenceCapitalIndexerBalanceSheetPrimeUncovered
        # Like PrimeUncovered above, but for the balance-sheet feed the indexer
        # reads independently of the Star monitor: a cycle still succeeds and
        # still advances every other prime's balance sheet, so nothing else
        # catches this one prime's /debt and /total-capital series freezing.
        expr: |
          sum by (star, cluster) (
            increase(reference_capital_sync_balance_sheet_primes_uncovered_total{k8s_namespace_name="vector"}[1h])
          ) > 0
        for: 30m
        labels:
          team: vector
          severity: warning
          component: reference-capital-indexer
          namespace: vector
        annotations:
          summary: "Vector reference-capital-indexer: prime `{{ $labels.star }}` not covered by the balance-sheet feed"
          description: |
            The balance-sheet feed reported no day for `{{ $labels.star }}` in any
            cycle's fetch window over the last hour, so its /debt and
            /total-capital series are frozen while every other prime advances.
            Confirm against the feed directly before assuming an outage.
          runbook_url: https://github.com/archon-research/stl/blob/main/docs/runbooks/vector-cronjobs.md#vectorreferencecapitalindexerbalancesheetprimeuncovered

      # -----------------------------------------------------------------------
      # WARNING — the balance-sheet write path stalled (B6 gap)
      # -----------------------------------------------------------------------
      - alert: VectorReferenceCapitalIndexerBalanceSheetStalled
        # Zero balance-sheet days inserted while cycles keep succeeding.
        # [36h]: the feed publishes at most one new day per prime per day, so
        # a shorter window false-positives on every normal no-new-day cycle.
        # The counter only counts a day's first-ever insert, not a build's
        # correction to one already stored, so a deploy cannot silence this.
        # `unless` (not `== 0`) also fires when the series is absent.
        expr: |
          sum by (cluster) (
            rate(cronjob_runs_total{service_name="reference-capital-indexer", status="success", k8s_namespace_name="vector"}[1h])
          ) > 0
          unless
          sum by (cluster) (
            increase(reference_capital_sync_balance_sheet_days_inserted_total{k8s_namespace_name="vector"}[36h])
          ) > 0
        for: 2h
        labels:
          team: vector
          severity: warning
          component: reference-capital-indexer
          namespace: vector
        annotations:
          summary: "Vector reference-capital-indexer inserted 0 balance-sheet days in 36h"
          description: |
            `prime_reference_balance_sheet` received 0 newly-inserted rows over
            36h while cycles kept succeeding. The daily balance-sheet write path
            has stopped advancing for every tracked prime, and each prime's
            /debt and /total-capital series is now frozen on its last value via
            locf.
          runbook_url: https://github.com/archon-research/stl/blob/main/docs/runbooks/vector-cronjobs.md#vectorreferencecapitalindexerbalancesheetstalled

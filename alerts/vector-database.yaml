# =============================================================================
# Vector — database error alerts
# =============================================================================
# Every Vector service reaches Postgres through one pool builder
# (`stl-verify/internal/adapters/outbound/postgres/db.go`), which attaches a pgx
# tracer emitting these counters for every query, batch and copy in the fleet:
#
#   db_query_total                                            all traced operations
#   db_query_errors_total{error_class}                        resources|retryable|other|unknown
#   db_query_errors_by_sqlstate_total{sqlstate, error_class}  breakdown only
#
# Rules key on `error_class`, never on `sqlstate`. The four classes are seeded
# at 0 when a pool is built, so `increase()` observes the first error of an
# incident. SQLSTATE is open-ended: its series first appears with the error that
# created it, and `increase()` cannot tell that first sample from no error at
# all — which is exactly how a class-53 storm stayed invisible. Use the
# by_sqlstate counter for triage, not for alert conditions.
#
# Background and triage: docs/runbooks/vector-database.md.
#
# Series carry (OTel SDK + gateway resource processor):
#   - service_name                         (OTel service.name)
#   - k8s_namespace_name="vector"          (k8sattributes processor)
#   - cluster="archon-prod" | "archon-staging"
#
# `namespace` is a static rule label since every rule filters to
# `k8s_namespace_name="vector"`; the mimir-rules-sync lint forbids `cluster` and
# `env` as static rule labels but allows `namespace`. `cluster` is preserved
# through `sum by` so the Alertmanager Slack template's `Cluster:` header fills.
#
# Severity → routing (per the alerting routing spec):
#   critical       → pages, prod #at_stl_prod_alerts / staging
#                    #at_stl_staging_alerts, [CRITICAL], 1h repeat.
#   warning / info → no page, prod #at_stl_alerts / staging
#                    #at_stl_staging_alerts, [WARNING]/[INFO], 4h repeat.
# =============================================================================
groups:
  - name: vector-database
    interval: 1m
    rules:
      # ---------------------------------------------------------------------
      # WARNING
      # ---------------------------------------------------------------------

      - alert: VectorDatabaseErrorRatioHigh
        # A ratio, not an absolute rate: services here range from a watcher
        # issuing hundreds of queries a second to a cronjob issuing a handful an
        # hour, and one threshold in queries/sec cannot be meaningful for both.
        #
        # Covers everything except `retryable`, so this never double-fires with
        # VectorDatabaseSerializationErrorsUnretried.
        #
        # `resources` (SQLSTATE class 53) is included but deliberately has no
        # rule of its own: TigerDataMemoryPressureCritical in the infrastructure
        # repo already pages on the instance-level cause, and a second critical
        # here paged twice for one incident. This keeps the per-service view —
        # which services are being refused — without the duplicate page.
        #
        # The absolute-rate conjunct keeps a near-idle service from paging on a
        # 100% ratio built out of one failed query.
        expr: |
          (
            sum by (service_name, cluster) (
              rate(db_query_errors_total{
                k8s_namespace_name="vector",
                error_class=~"resources|other|unknown"
              }[10m])
            )
            /
            sum by (service_name, cluster) (
              rate(db_query_total{k8s_namespace_name="vector"}[10m])
            )
          ) > 0.05
          and
          sum by (service_name, cluster) (
            rate(db_query_errors_total{
              k8s_namespace_name="vector",
              error_class=~"resources|other|unknown"
            }[10m])
          ) > 0.01
        for: 15m
        labels:
          team: vector
          severity: warning
          component: database
          namespace: vector
        annotations:
          summary: "Vector database error ratio high on {{ $labels.service_name }}"
          description: |
            `{{ $labels.service_name }}` is failing
            `{{ $value | humanizePercentage }}` of its database operations,
            sustained over 15m, excluding the serialization/deadlock codes
            covered by VectorDatabaseSerializationErrorsUnretried.

            If `sqlstate` is a class-53 code (53200 out_of_memory, 53300
            too_many_connections, 53100 disk_full) the instance itself is out of
            a resource — expect TigerDataMemoryPressureCritical to be firing,
            and treat that as the cause and this as the blast radius.

            Break `db_query_errors_by_sqlstate_total` down by `sqlstate` to
            classify: 57014 is a statement timeout, 42501 an append-only grant
            violation, 42P01/42703 a schema drift, "unknown" an error that never
            reached the server (connection reset, context cancellation).
          runbook_url: https://github.com/archon-research/stl/blob/main/docs/runbooks/vector-database.md#vectordatabaseerrorratiohigh

      - alert: VectorDatabaseSerializationErrorsUnretried
        # 40001 (serialization_failure) and 40P01 (deadlock_detected) are retried
        # only by BlockStateRepository.SaveBlock/HandleReorgAtomic, i.e. only in
        # the watchers. Excluding the codes fleet-wide would silence genuine
        # un-retried aborts in the ~30 repositories that have no retry at all, so
        # the exclusion is scoped to the services that actually retry.
        #
        # Elsewhere an abort rolls back the whole unit of work and the SQS
        # redrive re-runs it, so a one-off is handled and not actionable; only a
        # sustained rate (>5/h) means contention that will eventually DLQ.
        expr: |
          sum by (service_name, cluster) (
            increase(db_query_errors_total{
              k8s_namespace_name="vector",
              error_class="retryable",
              service_name!~".*watcher"
            }[1h])
          ) > 5
        for: 15m
        labels:
          team: vector
          severity: warning
          component: database
          namespace: vector
        annotations:
          summary: "Vector database serialization/deadlock aborts on {{ $labels.service_name }}"
          description: |
            `{{ $labels.service_name }}` hit
            `{{ $value | printf "%.0f" }}` serialization failures or deadlocks
            (SQLSTATE 40001 / 40P01) in the last hour. Only the watchers retry
            these; everywhere else the whole unit of work aborts and comes back
            through the SQS redrive, so a sustained rate means two writers are
            contending and messages are heading for the DLQ.

            Break `db_query_errors_by_sqlstate_total` down by `sqlstate` to
            separate serialization failures from deadlocks.
          runbook_url: https://github.com/archon-research/stl/blob/main/docs/runbooks/vector-database.md#vectordatabaseserializationerrorsunretried

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Same policy as index.html minus the two token-logo image hosts, which this
      app does not reach: a second entry inheriting a CSP it does not need would
      quietly widen the one the shipping app is held to.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/archon-32.png"
    />
    <meta name="theme-color" content="#000037" />
    <title>Combined master — curation</title>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/curation/main.tsx"></script>
  </body>
</html>

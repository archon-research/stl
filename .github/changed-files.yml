go:
  - stl-verify/**
  - '!stl-verify/python/**'
  - '!stl-verify/ts/**'
  - .go-version
  - lefthook.yml
  - stl-verify/lefthook.yml
  - stl-verify/python/lefthook.yml
  - stl-verify/ts/lefthook.yml
  - .github/changed-files.yml
  - .github/workflows/ci.yml
  - .github/workflows/deploy.yaml
  - .github/workflows/go-ci.yml
  - .github/workflows/go-sentinel-verify-compatibility.yml

python:
  - stl-verify/python/**
  - stl-verify/db/migrations/**
  - .python-version
  - lefthook.yml
  - stl-verify/lefthook.yml
  - stl-verify/python/lefthook.yml
  - .github/changed-files.yml
  - .github/workflows/ci.yml
  - .github/workflows/deploy.yaml
  - .github/workflows/python-ci.yml

ts:
  - stl-verify/ts/**
  - stl-verify/python/app/**
  - stl-verify/python/scripts/export_openapi_schema.py
  - stl-verify/python/Makefile
  - .node-version
  - lefthook.yml
  - stl-verify/lefthook.yml
  - stl-verify/ts/lefthook.yml
  - .github/changed-files.yml
  - .github/workflows/ci.yml
  - .github/workflows/deploy.yaml
  - .github/workflows/ts-ci.yml

# ORB-362: a roster or renderer change must run the deploy even when no code
# changed — the bot regenerates the overlays' images blocks from the roster, so
# a new image entry only reaches ArgoCD through a deploy run. No test suite keys
# off this group; only call-deploy in ci.yml does.
deploy:
  - k8s/image-roster.txt
  - scripts/deploy/render-overlay-images.sh

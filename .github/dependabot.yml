version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # npm updates are manual-only: trigger via Insights -> Dependency graph -> Dependabot ->
  # "Check for updates". The yearly interval exists because the schedule key is mandatory.
  - package-ecosystem: "npm"
    directory: "/stl-verify/ts"
    schedule:
      interval: "yearly"
    cooldown:
      default-days: 7 # mirrors .npmrc min-release-age=7
    ignore:
      # uikit versions move only through deliberate adoption PRs, never bot PRs
      - dependency-name: "@archon-research/*"
  # Base images are pinned by digest (VEC-783), so a published patch is a visible,
  # reviewable PR. Covers Dockerfile.common and Dockerfile.migrate in one entry.
  - package-ecosystem: "docker"
    directory: "/stl-verify"
    schedule:
      interval: "weekly"
  # Mirrors the /stl-verify entry above: python/Dockerfile's base images are
  # also digest-pinned (VEC-783).
  - package-ecosystem: "docker"
    directory: "/stl-verify/python"
    schedule:
      interval: "weekly"

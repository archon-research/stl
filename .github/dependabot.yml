version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # npm updates are manual-only: trigger via Insights -> Dependency graph -> Dependabot ->
  # "Check for updates". The yearly interval exists because the schedule key is mandatory.
  - package-ecosystem: "npm"
    directory: "/stl-verify/ts"
    schedule:
      interval: "yearly"
    cooldown:
      default-days: 7 # mirrors .npmrc min-release-age=7
    ignore:
      # uikit versions move only through deliberate adoption PRs, never bot PRs
      - dependency-name: "@archon-research/*"
    env:
      # Bypass engine-strict check: dependabot doesn't yet support npm 12, but our
      # packages require npm >=12.0.0. This env var suppresses the error and allows
      # dependabot to generate PRs. Once dependabot supports npm 12, this can be removed.
      npm_config_engine_strict: "false"

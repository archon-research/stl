# Actions pinned to commit SHAs for supply-chain security.
# update: git ls-remote --tags https://github.com/<org>/<action>.git | grep <tag>
#
# Standalone prod deploy, split out of deploy.yaml so a pending prod approval no
# longer holds the CI/staging run open. update-prod (in deploy.yaml) commits the
# prod-kustomization image-tag bump to main using the DEPLOY GitHub App token;
# App-token pushes DO trigger workflows, and ci.yml path-ignores that file, so
# this workflow fires exactly once per prod-tag change with no double-run. The
# push commit IS the deploy revision, so github.sha is used throughout.
#
# Two kinds of commit reach prod through here, and they carry different
# warrants — see validate-revision below.
name: Deploy Prod

on:
  push:
    branches: [main]
    paths:
      # Everything ArgoCD renders into stl-prod, not just the kustomization.
      # Until now a change to configmaps.yaml, external-secrets.yaml or a base
      # manifest triggered no deploy at all: it reached prod only when the next
      # image-tag bump happened to sweep it in, with no approval naming it
      # (#596 retuned prod avalanche-watcher throughput and produced no run).
      - k8s/overlays/prod/**
      # bootstrap/ is a manual-apply overlay the parent kustomization does not
      # reference, so ArgoCD never renders it — see its own header.
      - '!k8s/overlays/prod/bootstrap/**'
      - k8s/base/**

# Shared across all prod-deploy runs: a newer run cancels an older one that is
# still waiting for approval, so only the latest revision is pending at a time.
# Best-effort UX — the supersede-predecessors job and the freshness guard below
# are the real safety net because GitHub does not cancel an approval-waiting job
# via cancel-in-progress alone.
concurrency:
  group: stl-prod-deploy
  cancel-in-progress: true

permissions: {}

jobs:
  # cancel-in-progress cannot cancel a run parked on the approval gate, so
  # explicitly cancel older still-pending runs of this workflow: latest-wins,
  # only the newest prod run ever sits on the approval gate.
  supersede-predecessors:
    name: Supersede older pending prod runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - name: Cancel older pending runs
        run: |
          set -euo pipefail
          # Older runs still occupying a queue/approval slot. GitHub cannot
          # cancel an approval-waiting run via cancel-in-progress, so do it here.
          # Shell env ($RUN_ID/$RUN_NUMBER) expands inside the jq program — no
          # GitHub-expression interpolation in the run block (zizmor
          # template-injection hygiene; values arrive via env only).
          PENDING=$(gh api "repos/$REPO/actions/workflows/deploy-prod.yaml/runs?per_page=100" \
            --jq ".workflow_runs[]
                    | select(.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\")
                    | select((.id | tostring) != \"$RUN_ID\")
                    | select(.run_number < ($RUN_NUMBER | tonumber))
                    | .id" || true)
          for id in $PENDING; do
            echo "Cancelling superseded prod run ${id}"
            gh api --method POST "repos/$REPO/actions/runs/${id}/cancel" || true
          done

  # Which trust path did this revision arrive by?
  #
  # The `main` ruleset requires a pull request, a CODEOWNERS review, the
  # required status checks, the merge queue and a signature — for everyone. It
  # has exactly ONE bypass actor: the deploy GitHub App. So:
  #
  #   merged PR into main  -> the commit provably cleared human review
  #   no merged PR         -> the commit provably came through the App's
  #                           unreviewed direct-to-main write
  #
  # The image-tags-only contract is the compensating control for that second,
  # unreviewed path — the same four guards run in deploy.yaml's update-prod at
  # the moment the bot creates the commit. Applying it to reviewed commits
  # demanded that a CODEOWNERS-approved manifest change look like an unreviewed
  # tag bump, which is what blocked the #623 revert.
  #
  # The control here is the ruleset, not an author string. Someone holding the
  # App token can push whatever they like, but it lands with no PR and so falls
  # in the strict branch; reaching the relaxed branch means actually getting a
  # PR through CODEOWNERS review.
  #
  # Runs BEFORE notify-prod-pending so a revision that cannot deploy never
  # requests an approval. deploy-prod re-derives all of this inside the
  # privileged job — this copy is fail-fast UX, not a security control.
  validate-revision:
    name: Validate deploy revision
    needs: supersede-predecessors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      reviewed: ${{ steps.classify.outputs.reviewed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Full history: the revision contract diffs against the parent commit.
          fetch-depth: 0
          persist-credentials: false

      # KEEP IN SYNC with "Re-validate deploy revision (fail closed)" in
      # deploy-prod. That copy is authoritative; this one only fails faster.
      - name: Classify and validate
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
          KUSTOMIZATION: k8s/overlays/prod/kustomization.yaml
          PROD_ECR_PREFIX: 030797368798.dkr.ecr.eu-west-1.amazonaws.com/stl-sentinelprod-
        run: |
          set -euo pipefail

          REVIEWED=$(gh api "repos/${REPO}/commits/${DEPLOY_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')

          if [ "$REVIEWED" -gt 0 ]; then
            echo "reviewed=true" >> "$GITHUB_OUTPUT"
            echo "${DEPLOY_SHA} arrived via a merged PR: CODEOWNERS-reviewed, generated-block contract not applicable."
          else
            echo "reviewed=false" >> "$GITHUB_OUTPUT"
            echo "${DEPLOY_SHA} has no merged PR: unreviewed App write, enforcing the generated-block contract."

            PARENT=$(git rev-parse "${DEPLOY_SHA}^")

            CHANGED_FILES=$(git diff --name-only "${PARENT}" "${DEPLOY_SHA}")
            if [ "$CHANGED_FILES" != "$KUSTOMIZATION" ]; then
              echo "::error::Unreviewed revision ${DEPLOY_SHA} changes files beyond ${KUSTOMIZATION}:"
              echo "$CHANGED_FILES"
              exit 1
            fi

            # ORB-362: an App write may only replace the generated images block,
            # and the result must be exactly what the roster at this revision
            # renders (the roster itself is covered by the files check above).
            git show "${PARENT}:${KUSTOMIZATION}" > "${RUNNER_TEMP}/kustomization.parent.yaml"
            if ! diff -u \
                <(scripts/deploy/render-overlay-images.sh --strip "${RUNNER_TEMP}/kustomization.parent.yaml") \
                <(scripts/deploy/render-overlay-images.sh --strip "$KUSTOMIZATION"); then
              echo "::error::Unreviewed revision ${DEPLOY_SHA} changes ${KUSTOMIZATION} outside the generated images block."
              exit 1
            fi
            if ! scripts/deploy/render-overlay-images.sh --env prod --check "$KUSTOMIZATION"; then
              echo "::error::Unreviewed revision ${DEPLOY_SHA}: the prod images block is not what k8s/image-roster.txt renders."
              exit 1
            fi
          fi

          # Both paths: every image must resolve to the prod ECR account with a
          # well-formed tag. Anchored (not substring) so a name that merely
          # embeds the prefix elsewhere cannot pass.
          BAD_IMAGES=$(awk -v p="$PROD_ECR_PREFIX" '
            /^[[:space:]]*newName:/ {
              v=$0; sub(/^[[:space:]]*newName:[[:space:]]*/,"",v); gsub(/^"|"$/,"",v)
              if (index(v,p)!=1) print
            }' "$KUSTOMIZATION")
          if [ -n "$BAD_IMAGES" ]; then
            echo "::error::Prod kustomization references images outside the prod ECR account:"
            echo "$BAD_IMAGES"
            exit 1
          fi

          BAD_TAGS=$(grep -E '^[[:space:]]*newTag:' "$KUSTOMIZATION" \
            | grep -Ev '^[[:space:]]*newTag:[[:space:]]*"([a-z0-9]+-)*[a-f0-9]{40}"[[:space:]]*$' \
            || true)
          if [ -n "$BAD_TAGS" ]; then
            echo "::error::Prod kustomization has malformed image tags:"
            echo "$BAD_TAGS"
            exit 1
          fi

  notify-prod-pending:
    name: Notify Prod Deploy Awaiting Approval
    needs: [supersede-predecessors, validate-revision]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      ts: ${{ steps.notify.outputs.ts }}
    env:
      ARGOCD_SERVER_HOST: argocd-prod-archon
      APP: stl-prod
    steps:
      - name: Configure AWS credentials (ArgoCD read-only)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::030797368798:role/archonprod-github-actions-argocd-wait
          aws-region: eu-west-1

      - name: Fetch Tailscale + ArgoCD read-only token
        uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 # v3.0.1
        with:
          secret-ids: |
            TS, archon-prod-argocd-ci-tailscale-oauth
            ARGOCD, archon-prod-argocd-ci-token
          parse-json-secrets: true

      - name: Connect Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ env.TS_CLIENT_ID }}
          oauth-secret: ${{ env.TS_CLIENT_SECRET }}
          tags: tag:ci-runner

      - name: Install ArgoCD CLI
        env:
          ARGOCD_VERSION: v2.13.3
        run: |
          set -euo pipefail
          base="https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}"
          # Download under the release's own filename so the published checksum
          # line (`<hash>  argocd-linux-amd64`) matches what `sha256sum -c` looks
          # for in /tmp — otherwise it errors "No such file or directory".
          curl -sSfL -o /tmp/argocd-linux-amd64 "${base}/argocd-linux-amd64"
          curl -sSfL -o /tmp/cli_checksums.txt "${base}/cli_checksums.txt"
          ( cd /tmp && grep 'argocd-linux-amd64$' cli_checksums.txt | sha256sum -c - )
          sudo install -m 0755 /tmp/argocd-linux-amd64 /usr/local/bin/argocd

      - name: Resolve ArgoCD server and read baseline + diff
        id: argocd
        env:
          ARGOCD_AUTH_TOKEN: ${{ env.ARGOCD_TOKEN }}
          ARGOCD_OPTS: --plaintext --grpc-web
          HOST: ${{ env.ARGOCD_SERVER_HOST }}
          APP_NAME: ${{ env.APP }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IP=""
          for i in $(seq 1 30); do
            IP=$(tailscale ip -4 "$HOST" 2>/dev/null || echo "")
            if [ -n "$IP" ]; then break; fi
            echo "Attempt ${i}/30: cannot resolve ${HOST} yet..."
            sleep 2
          done
          if [ -z "$IP" ]; then
            echo "::error::Failed to resolve ${HOST} via Tailscale"
            exit 1
          fi
          ARGOCD_SERVER="$IP"
          export ARGOCD_SERVER

          # Baseline = the app revision currently LIVE in prod, taken from the
          # running image tags — NOT .status.sync.revision. stl-prod tracks
          # main/HEAD, so sync.revision advances to ~HEAD on every refresh and
          # yields an empty changelog range (only this deploy's own tag commit).
          # The running image tag is the true "what's in prod" and correctly
          # batches any rejected deploys (prod keeps the last-approved tag).
          # Match only bare deploy-tag refs (`repo:<hex>`); the `$`-anchored
          # 7-40 hex window can't match a 64-char `@sha256:` digest suffix.
          LIVE_TAGS=$(argocd app get "$APP_NAME" -o json 2>/dev/null \
            | jq -r '[.status.summary.images[]? | capture(":(?<t>[0-9a-f]{7,40})$")? | .t] | unique | .[]' 2>/dev/null || true)
          N_TAGS=$(printf '%s' "$LIVE_TAGS" | grep -c . || true); N_TAGS=${N_TAGS:-0}
          # Only anchor when there's exactly one distinct live tag. Multiple tags
          # (mid-rollout, or a workload pinned elsewhere) have no single "what's
          # in prod", so fall back to the no-range message rather than guessing.
          if [ "$N_TAGS" -eq 1 ]; then
            BASELINE="$LIVE_TAGS"
          else
            BASELINE=""
            [ "$N_TAGS" -gt 1 ] && echo "::warning::stl-prod reports ${N_TAGS} distinct live image tags; cannot anchor changelog baseline"
          fi
          echo "baseline=${BASELINE}" >> "$GITHUB_OUTPUT"

          # Refresh first so ArgoCD fetches the just-pushed deploy commit into
          # its repo cache; otherwise `diff --revision <new-sha>` races the fetch
          # and errors, leaving an empty summary. Best-effort.
          argocd app get "$APP_NAME" --refresh -o json >/dev/null 2>&1 || true
          # `argocd app diff` exits non-zero when there IS a diff — expected.
          # Best-effort: a diff hiccup must not block the approval request.
          # Keep stderr out of the diff body so a benign CLI warning can't be
          # mistaken for diff content (or trigger a false "unavailable" note).
          DIFF=$(argocd app diff "$APP_NAME" --revision "$DEPLOY_SHA" 2>/tmp/argocd_diff.err || true)
          DIFF_ERR=$(cat /tmp/argocd_diff.err 2>/dev/null || true)
          # A prod deploy only bumps image tags, so the raw diff is one near
          # identical 6-line block per workload — a huge wall in Slack. Collapse
          # it to the count + changed resource names (the tag is the deploy SHA,
          # shown once in the changelog). Resource headers look like
          # `===== apps/Deployment vector/allocation-tracker =====`.
          RESOURCES=$(printf '%s\n' "$DIFF" \
            | sed -nE 's/^=====[[:space:]]+(.*)[[:space:]]+=====$/\1/p' \
            | awk '{print $NF}' || true)
          COUNT=$(printf '%s' "$RESOURCES" | grep -c . || true); COUNT=${COUNT:-0}
          LIST=$(printf '%s\n' "$RESOURCES" | sed '/^$/d' | head -20 | paste -sd ', ' - || true)
          if [ "$COUNT" -gt 20 ]; then LIST="${LIST}, …and $((COUNT - 20)) more"; fi
          # Distinguish "no diff" from "diff produced unparseable output" (a
          # transient CLI/fetch error) so the summary is never silently dropped.
          DIFF_NOTE=""
          if [ "$COUNT" -eq 0 ] && [ -n "$(printf '%s' "$DIFF_ERR" | tr -d '[:space:]')" ]; then
            DIFF_NOTE="diff unavailable (see run logs)"
          fi
          {
            echo "diff_count=${COUNT}"
            echo "diff_note=${DIFF_NOTE}"
            echo "diff_list<<ARGOCD_DIFF_EOF"
            printf '%s\n' "$LIST"
            echo "ARGOCD_DIFF_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build changelog
        id: changelog
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASELINE: ${{ steps.argocd.outputs.baseline }}
          DEPLOY_SHA: ${{ github.sha }}
          ARGOCD_DIFF_COUNT: ${{ steps.argocd.outputs.diff_count }}
          ARGOCD_DIFF_LIST: ${{ steps.argocd.outputs.diff_list }}
          ARGOCD_DIFF_NOTE: ${{ steps.argocd.outputs.diff_note }}
        run: |
          set -euo pipefail
          DEPLOY_SHORT=${DEPLOY_SHA:0:7}
          BASE_SHORT=${BASELINE:0:7}

          if [ -z "$BASELINE" ] || ! git cat-file -e "${BASELINE}^{commit}" 2>/dev/null; then
            # Baseline unknown or not in history (first deploy / squashed) — show
            # deploy SHA without commit range rather guessing.
            CHANGELOG="*Prod deploy* \`${DEPLOY_SHORT}\`"$'\n'"_No diff range last-synced revision (\`${BASE_SHORT:-unknown}\`)._"
          elif [ "$BASELINE" = "$DEPLOY_SHA" ]; then
            CHANGELOG="*Prod deploy* \`${DEPLOY_SHORT}\` — no code changes since last sync."
          else
            MERGED_PRS=$(git log --merges --format="%s" "${BASELINE}..${DEPLOY_SHA}" | grep -oE '#[0-9]+' | sort -u || true)
            TOTAL_PRS=$(printf '%s\n' "$MERGED_PRS" | grep -c . || true)

            PR_LIST=""
            for pr_num in $(printf '%s\n' "$MERGED_PRS" | head -15); do
              num=${pr_num#\#}
              PR_INFO=$(gh pr view "$num" --json title,url,author --jq '"- <\(.url)|#'"$num"' \(.title)> by @\(.author.login)"' 2>/dev/null || true)
              if [ -n "$PR_INFO" ]; then PR_LIST="${PR_LIST}${PR_INFO}"$'\n'; fi
            done

            TOTAL_COMMITS=$(git log --oneline --no-merges "${BASELINE}..${DEPLOY_SHA}" -- stl-verify/ | wc -l | tr -d ' ')
            COMMITS=$(git log --oneline --no-merges -n 20 "${BASELINE}..${DEPLOY_SHA}" -- stl-verify/ || true)

            CHANGELOG="*Changes:* \`${BASE_SHORT}\` → \`${DEPLOY_SHORT}\` (last-synced → deploy)"
            if [ -n "$PR_LIST" ]; then
              CHANGELOG="${CHANGELOG}"$'\n\n'"*Merged PRs:*"$'\n'"${PR_LIST}"
              if [ "$TOTAL_PRS" -gt 15 ]; then CHANGELOG="${CHANGELOG}…and $((TOTAL_PRS - 15)) more"; fi
            fi
            if [ -n "$COMMITS" ]; then
              CHANGELOG="${CHANGELOG}"$'\n\n'"*Commits (stl-verify):*"$'\n''```'$'\n'"${COMMITS}"$'\n''```'
              if [ "$TOTAL_COMMITS" -gt 20 ]; then CHANGELOG="${CHANGELOG}"$'\n'"…and $((TOTAL_COMMITS - 20)) more"; fi
            fi
          fi

          if [ "${ARGOCD_DIFF_COUNT:-0}" -gt 0 ]; then
            CHANGELOG="${CHANGELOG}"$'\n\n'"*ArgoCD (\`stl-prod\`):* ${ARGOCD_DIFF_COUNT} workloads → \`${DEPLOY_SHORT}\`"$'\n'"${ARGOCD_DIFF_LIST}"
          elif [ -n "${ARGOCD_DIFF_NOTE:-}" ]; then
            CHANGELOG="${CHANGELOG}"$'\n\n'"*ArgoCD (\`stl-prod\`):* ${ARGOCD_DIFF_NOTE}"
          fi

          {
            echo "body<<CHANGELOG_EOF"
            printf '%s\n' "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: archon-research/github-actions
          ref: 01f058b0afe92a8485728e412c13a4e767fb4595 # github-actions #32 (slack-notify blob identical to #28)
          ssh-key: ${{ secrets.GH_ACTIONS_DEPLOY_KEY }}
          path: .github-actions
          persist-credentials: false

      - name: Notify Slack — awaiting approval
        id: notify
        uses: ./.github-actions/slack-notify
        with:
          status: pending
          context: Prod Deploy
          body: ${{ steps.changelog.outputs.body }}
          slack-channel-id: ${{ secrets.SLACK_CHANNEL_ID_PROD }}
          slack-token-secret-id: archon-prod-slack-bot-token
          aws-role-arn: arn:aws:iam::030797368798:role/archonprod-github-actions-slack-notify

  deploy-prod:
    name: Deploy Prod (ArgoCD sync)
    needs: [supersede-predecessors, notify-prod-pending]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
      # get-environment-review reads GET /actions/runs/{run_id}/approvals.
      actions: read
      # Re-validation reads GET /commits/{sha}/pulls to classify the revision.
      pull-requests: read
    outputs:
      started: ${{ steps.mark-approved.outputs.started }}
      notified: ${{ steps.notified.outputs.sent }}
    env:
      APP: stl-prod
      PROD_ECR_PREFIX: 030797368798.dkr.ecr.eu-west-1.amazonaws.com/stl-sentinelprod-
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      # First step in the gated job: a rejected review never reaches this, so a
      # missing `started` output is how notify-prod-rejected tells reject apart
      # from a genuine sync failure (mirrors infra archon-prod-deploy).
      - name: Mark approved
        id: mark-approved
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Full history: re-validation diffs against the parent commit and the
          # freshness guard greps main for a newer prod-bump commit.
          fetch-depth: 0
          persist-credentials: false

      # MUST stay above the first step that can fail. `Notify Slack — deploy
      # failed` is a local action from this checkout, so anything that fails
      # before it lands (the re-validation guard, the freshness check, the
      # approval-review fetch) leaves the notifier unresolvable and the failure
      # silent in Slack. notify-prod-failure does not cover this gated job.
      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: archon-research/github-actions
          ref: 01f058b0afe92a8485728e412c13a4e767fb4595 # argocd-sync (github-actions #32, server-scheme fix)
          ssh-key: ${{ secrets.GH_ACTIONS_DEPLOY_KEY }}
          path: .github-actions
          persist-credentials: false

      - name: Re-validate deploy revision (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KUSTOMIZATION: k8s/overlays/prod/kustomization.yaml
        run: |
          set -euo pipefail

          # Authoritative copy of validate-revision, re-derived here inside the
          # privileged job so the pre-gate job's verdict is never trusted.
          # KEEP IN SYNC with "Classify and validate" above.
          REVIEWED=$(gh api "repos/${REPO}/commits/${DEPLOY_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')

          if [ "$REVIEWED" -gt 0 ]; then
            echo "${DEPLOY_SHA} cleared CODEOWNERS review via a merged PR; skipping the generated-block contract."
          else
            # Unreviewed App write: it may only ever be an image-tag bump.
            PARENT=$(git rev-parse "${DEPLOY_SHA}^")

            CHANGED_FILES=$(git diff --name-only "${PARENT}" "${DEPLOY_SHA}")
            if [ "$CHANGED_FILES" != "$KUSTOMIZATION" ]; then
              echo "::error::Unreviewed revision ${DEPLOY_SHA} changes files beyond ${KUSTOMIZATION}:"
              echo "$CHANGED_FILES"
              exit 1
            fi

            # ORB-362: an App write may only replace the generated images block,
            # and the result must be exactly what the roster at this revision
            # renders (the roster itself is covered by the files check above).
            git show "${PARENT}:${KUSTOMIZATION}" > "${RUNNER_TEMP}/kustomization.parent.yaml"
            if ! diff -u \
                <(scripts/deploy/render-overlay-images.sh --strip "${RUNNER_TEMP}/kustomization.parent.yaml") \
                <(scripts/deploy/render-overlay-images.sh --strip "$KUSTOMIZATION"); then
              echo "::error::Unreviewed revision ${DEPLOY_SHA} changes ${KUSTOMIZATION} outside the generated images block."
              exit 1
            fi
            if ! scripts/deploy/render-overlay-images.sh --env prod --check "$KUSTOMIZATION"; then
              echo "::error::Unreviewed revision ${DEPLOY_SHA}: the prod images block is not what k8s/image-roster.txt renders."
              exit 1
            fi
          fi

          # Anchored: image name must START WITH the prod ECR prefix, not merely
          # contain it. DEPLOY_SHA here is the commit revision, not the image
          # tag, so tags are validated by shape (optional prefix + 40-hex sha).
          BAD_IMAGES=$(awk -v p="$PROD_ECR_PREFIX" '
            /^[[:space:]]*newName:/ {
              v=$0; sub(/^[[:space:]]*newName:[[:space:]]*/,"",v); gsub(/^"|"$/,"",v)
              if (index(v,p)!=1) print
            }' "$KUSTOMIZATION")
          if [ -n "$BAD_IMAGES" ]; then
            echo "::error::Prod kustomization references images outside the prod ECR account:"
            echo "$BAD_IMAGES"
            exit 1
          fi

          BAD_TAGS=$(grep -E '^[[:space:]]*newTag:' "$KUSTOMIZATION" \
            | grep -Ev '^[[:space:]]*newTag:[[:space:]]*"([a-z0-9]+-)*[a-f0-9]{40}"[[:space:]]*$' \
            || true)
          if [ -n "$BAD_TAGS" ]; then
            echo "::error::Prod kustomization has malformed image tags:"
            echo "$BAD_TAGS"
            exit 1
          fi
          echo "Re-validation passed for ${DEPLOY_SHA} (reviewed=${REVIEWED})."

      # Freshness. stl-prod tracks `targetRevision: HEAD`, so the question is
      # not "is this the newest tag bump?" but "does this revision still render
      # the same prod output as main HEAD?". Syncing a revision that differs
      # pins prod to stale manifests AND leaves the app permanently OutOfSync
      # against HEAD, so the post-sync wait can never observe Synced and burns
      # its timeout. Both happened in run 30096520501: an approved tag bump
      # re-applied a replicas override the newer revert had already removed
      # (scaling avalanche-allocation-tracker back to 0), then failed the wait.
      #
      # Comparing against the newest `deploy(prod)` commit — the previous
      # behaviour — missed this, because that bump WAS the newest of its kind;
      # main had simply moved two non-bump commits past it. Comparing the
      # rendered paths instead lets unrelated merges (docs, CI) through while
      # catching anything ArgoCD would actually see. bootstrap/ is excluded: a
      # manual-apply overlay the parent kustomization does not reference.
      - name: Check this revision still matches main HEAD
        id: fresh
        run: |
          set -euo pipefail
          git fetch -q origin main
          HEAD_SHA=$(git rev-parse origin/main)

          if [ "$HEAD_SHA" = "$DEPLOY_SHA" ]; then
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$DEPLOY_SHA" "$HEAD_SHA" -- \
                 k8s/overlays/prod k8s/base ':(exclude)k8s/overlays/prod/bootstrap'; then
            # main moved on, but nothing ArgoCD renders changed, so syncing this
            # revision still converges on HEAD.
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::main (${HEAD_SHA}) carries prod-affecting changes beyond ${DEPLOY_SHA}; skipping sync so prod is not pinned to a stale revision. The newer commit's own run rolls everything out."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch approval review
        id: review
        uses: ./.github/actions/get-environment-review
        with:
          environment: production
          state: approved

      - name: React to Slack message — superseded
        if: ${{ steps.fresh.outputs.superseded == 'true' }}
        uses: ./.github-actions/slack-notify
        with:
          status: pending
          context: Prod Deploy
          slack-channel-id: ${{ secrets.SLACK_CHANNEL_ID_PROD }}
          slack-token-secret-id: archon-prod-slack-bot-token
          aws-role-arn: arn:aws:iam::030797368798:role/archonprod-github-actions-slack-notify
          message-ts: ${{ needs.notify-prod-pending.outputs.ts }}
          reaction: recycle

      - name: React to Slack message — approved
        if: ${{ steps.review.outputs.found == 'true' && steps.fresh.outputs.superseded != 'true' }}
        uses: ./.github-actions/slack-notify
        with:
          status: approved
          context: Prod Deploy
          reviewer: ${{ steps.review.outputs.reviewer }}
          comment: ${{ steps.review.outputs.comment }}
          slack-channel-id: ${{ secrets.SLACK_CHANNEL_ID_PROD }}
          slack-token-secret-id: archon-prod-slack-bot-token
          aws-role-arn: arn:aws:iam::030797368798:role/archonprod-github-actions-slack-notify
          message-ts: ${{ needs.notify-prod-pending.outputs.ts }}
          reaction: white_check_mark

      - name: Sync stl-prod to the approved revision
        if: ${{ steps.fresh.outputs.superseded != 'true' }}
        uses: ./.github-actions/argocd-sync
        with:
          app: ${{ env.APP }}
          revision: ${{ github.sha }}
          server: http://argocd-prod-archon
          aws-role-arn: arn:aws:iam::030797368798:role/archonprod-github-actions-argocd-sync
          tailscale-secret-id: archon-prod-argocd-ci-tailscale-oauth
          argocd-token-secret-id: archon-prod-argocd-deploy-token

      - name: Notify Slack — deploy succeeded
        if: ${{ success() && steps.fresh.outputs.superseded != 'true' }}
        uses: ./.github-actions/slack-notify
        with:
          status: success
          context: Prod Deploy
          slack-channel-id: ${{ secrets.SLACK_CHANNEL_ID_PROD }}
          slack-token-secret-id: archon-prod-slack-bot-token
          aws-role-arn: arn:aws:iam::030797368798:role/archonprod-github-actions-slack-notify
          thread-ts: ${{ needs.notify-prod-pending.outputs.ts }}

      - name: Notify Slack — deploy failed
        id: notify-failed
        if: ${{ failure() && steps.mark-approved.outputs.started == 'true' }}
        uses: ./.github-actions/slack-notify
        with:
          status: failure
          context: Prod Deploy
          slack-channel-id: ${{ secrets.SLACK_CHANNEL_ID_PROD }}
          slack-token-secret-id: archon-prod-slack-bot-token
          aws-role-arn: arn:aws:iam::030797368798:role/archonprod-github-actions-slack-notify
          thread-ts: ${{ needs.notify-prod-pending.outputs.ts }}

      # The threaded notice above is itself a local action from the shared
      # checkout, so it cannot report a failure of that checkout. Record whether
      # it actually sent, and let notify-prod-deploy-failed (webhook, no
      # checkout required) cover the case where it did not.
      - name: Record whether the failure notice was sent
        id: notified
        if: always()
        env:
          OUTCOME: ${{ steps.notify-failed.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = "success" ]; then
            echo "sent=true" >> "$GITHUB_OUTPUT"
          else
            echo "sent=false" >> "$GITHUB_OUTPUT"
          fi

  notify-prod-rejected:
    name: Notify Prod Deploy Rejected
    needs: [notify-prod-pending, deploy-prod]
    if: >-
      always() &&
      needs.notify-prod-pending.result == 'success' &&
      needs.deploy-prod.result == 'failure' &&
      needs.deploy-prod.outputs.started != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch rejection review
        id: review
        uses: ./.github/actions/get-environment-review
        with:
          environment: production
          state: rejected

      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: archon-research/github-actions
          ref: 01f058b0afe92a8485728e412c13a4e767fb4595 # github-actions #32 (slack-notify blob identical to #28)
          ssh-key: ${{ secrets.GH_ACTIONS_DEPLOY_KEY }}
          path: .github-actions
          persist-credentials: false

      # always(): a rejected prod deploy must always be visible. If the review
      # fetch above failed, post with an empty reviewer rather than silently
      # skipping the notice — this job has no other failure path.
      - name: React to Slack message — rejected
        if: always()
        uses: ./.github-actions/slack-notify
        with:
          status: rejected
          context: Prod Deploy
          reviewer: ${{ steps.review.outputs.reviewer }}
          comment: ${{ steps.review.outputs.comment }}
          slack-channel-id: ${{ secrets.SLACK_CHANNEL_ID_PROD }}
          slack-token-secret-id: archon-prod-slack-bot-token
          aws-role-arn: arn:aws:iam::030797368798:role/archonprod-github-actions-slack-notify
          message-ts: ${{ needs.notify-prod-pending.outputs.ts }}
          reaction: no_entry

  # Best-effort cleanup when a newer run cancels this one while it waits for
  # approval (concurrency: cancel-in-progress). Marks the orphaned pending
  # message as superseded. The freshness guard in deploy-prod covers the case
  # where the cancel does not fire and a stale approval lands instead.
  notify-prod-superseded:
    name: Notify Prod Deploy Superseded
    needs: [notify-prod-pending, deploy-prod]
    if: >-
      always() &&
      needs.notify-prod-pending.result == 'success' &&
      needs.deploy-prod.result == 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: archon-research/github-actions
          ref: 01f058b0afe92a8485728e412c13a4e767fb4595 # github-actions #32 (slack-notify blob identical to #28)
          ssh-key: ${{ secrets.GH_ACTIONS_DEPLOY_KEY }}
          path: .github-actions
          persist-credentials: false

      - name: React to Slack message — superseded
        uses: ./.github-actions/slack-notify
        with:
          status: pending
          context: Prod Deploy
          slack-channel-id: ${{ secrets.SLACK_CHANNEL_ID_PROD }}
          slack-token-secret-id: archon-prod-slack-bot-token
          aws-role-arn: arn:aws:iam::030797368798:role/archonprod-github-actions-slack-notify
          message-ts: ${{ needs.notify-prod-pending.outputs.ts }}
          reaction: recycle

  # Fallback for the one failure the threaded notice cannot report: a failure of
  # the shared-actions checkout the notice itself depends on. `started` excludes
  # rejections (notify-prod-rejected owns those); `notified != 'true'` means the
  # threaded notice did not send.
  #
  # Partial by construction: slack-notify.yaml performs the same checkout with
  # the same deploy key, so this covers a transient checkout failure, not a
  # rotated key. It closes the realistic gap, not every gap.
  notify-prod-deploy-failed:
    name: Notify Prod Deploy Failure (fallback)
    if: >-
      always() &&
      needs.deploy-prod.result == 'failure' &&
      needs.deploy-prod.outputs.started == 'true' &&
      needs.deploy-prod.outputs.notified != 'true'
    needs: deploy-prod
    uses: ./.github/workflows/slack-notify.yaml
    with:
      status: failure
      context: Prod Deploy
      failed-jobs: |
        Deploy Prod (ArgoCD sync)=${{ needs.deploy-prod.result }}
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_PROD }}
      gh-actions-deploy-key: ${{ secrets.GH_ACTIONS_DEPLOY_KEY }}

  # Covers the pre-gate prod pipeline in this workflow (supersede + validate +
  # pending). The gated deploy-prod job posts its own threaded success/failure,
  # and notify-prod-rejected handles a rejected review — both excluded here.
  # This is the only notice a revision rejected by validate-revision gets, since
  # it never reaches the approval thread.
  notify-prod-failure:
    name: Notify Prod Deploy Failure
    if: ${{ always() && (needs.supersede-predecessors.result == 'failure' || needs.validate-revision.result == 'failure' || needs.notify-prod-pending.result == 'failure') }}
    needs: [supersede-predecessors, validate-revision, notify-prod-pending]
    uses: ./.github/workflows/slack-notify.yaml
    with:
      status: failure
      context: Prod Deploy
      failed-jobs: |
        Supersede older pending prod runs=${{ needs.supersede-predecessors.result }}
        Validate deploy revision=${{ needs.validate-revision.result }}
        Notify Prod Deploy Awaiting Approval=${{ needs.notify-prod-pending.result }}
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_PROD }}
      gh-actions-deploy-key: ${{ secrets.GH_ACTIONS_DEPLOY_KEY }}

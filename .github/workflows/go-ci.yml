name: Go CI

on:
  workflow_call:

defaults:
  run:
    working-directory: stl-verify

jobs:
  lint:
    name: Lint & Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'
          cache: true
          cache-dependency-path: 'stl-verify/go.sum'

      # goimports is pinned so an upstream formatting change can't red the
      # gate on an unrelated PR; govulncheck stays @latest deliberately (the
      # point is the freshest vuln-DB client).
      - name: Install goimports and govulncheck
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.49.0
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Format and module checks
        run: make fmt-check goimports-check tidy-check shared-container-check integration-shard-check

      # Runs the golangci-lint binary directly (not `make golangci-lint`) so
      # the action can manage the binary install and analysis cache. Covers
      # go vet, staticcheck, and go fix's modernizers — see .golangci.yml.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2 # keep in sync with `tools` in stl-verify/Makefile
          working-directory: stl-verify

      - name: govulncheck
        run: make vulncheck

      - name: Check for uncommitted changes
        run: |
          if ! git diff --quiet; then
            echo "::error::CI modified files. Please run 'make fmt tidy' locally and commit the changes."
            git diff --name-only
            exit 1
          fi

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'
          cache: true
          cache-dependency-path: 'stl-verify/go.sum'

      - name: Run unit tests
        run: make test-race

  integration-tests:
    name: Integration Tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'
          cache: true
          cache-dependency-path: 'stl-verify/go.sum'

      - name: Pull container images
        run: |
          IMAGES=$(grep -E 'Image[A-Za-z0-9_]+[[:space:]]*=' internal/testutil/images.go | grep -oP '".*?"' | tr -d '"')
          if [ -z "$IMAGES" ]; then
            echo "::error::No image constants found in internal/testutil/images.go -- check the grep pattern"
            exit 1
          fi
          for IMAGE in $IMAGES; do
            docker pull "$IMAGE"
          done

      - name: Run integration tests
        run: make test-integration-shard INTEGRATION_SHARD=${{ matrix.shard }}

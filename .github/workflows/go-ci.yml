name: Go CI

on:
  workflow_call:

defaults:
  run:
    working-directory: stl-verify

jobs:
  lint:
    name: Lint & Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'
          cache: true
          cache-dependency-path: 'stl-verify/go.sum'

      # goimports is pinned so an upstream formatting change can't red the
      # gate on an unrelated PR; govulncheck stays @latest deliberately (the
      # point is the freshest vuln-DB client).
      - name: Install goimports and govulncheck
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.49.0
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Format and module checks
        run: make fmt-check goimports-check tidy-check shared-container-check integration-shard-check ci-service-check

      # Runs the golangci-lint binary directly (not `make golangci-lint`) so
      # the action can manage the binary install and analysis cache. Covers
      # go vet, staticcheck, and go fix's modernizers — see .golangci.yml.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2 # keep in sync with `tools` in stl-verify/Makefile
          working-directory: stl-verify

      - name: govulncheck
        run: make vulncheck

      - name: Check for uncommitted changes
        run: |
          if ! git diff --quiet; then
            echo "::error::CI modified files. Please run 'make fmt tidy' locally and commit the changes."
            git diff --name-only
            exit 1
          fi

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'
          cache: true
          cache-dependency-path: 'stl-verify/go.sum'

      - name: Run unit tests
        run: make test-race

  integration-tests:
    name: Integration Tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    # One service set per shard instead of one per test package: `go test`
    # compiles a binary per package, so a container started in TestMain is shared
    # within one process only, and container starts grew with package count.
    # `services:` also pulls during job setup, replacing the explicit pull step.
    # LocalStack needs the union of every service set the packages request.
    services:
      timescaledb:
        image: timescale/timescaledb:2.29.2-pg18 # keep in sync with internal/testutil/images.go
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:8.0.6-alpine # keep in sync with internal/testutil/images.go
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      localstack:
        image: localstack/localstack:4.3 # keep in sync with internal/testutil/images.go
        env:
          SERVICES: s3,sns,sqs
          DEBUG: 0
          DISABLE_EVENTS: 1
          SKIP_SSL_CERT_DOWNLOAD: 1
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      STL_TEST_POSTGRES_DSN: postgres://test:test@localhost:5432/testdb?sslmode=disable
      STL_TEST_REDIS_ADDR: localhost:6379
      STL_TEST_LOCALSTACK_ENDPOINT: http://localhost:4566

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'
          cache: true
          cache-dependency-path: 'stl-verify/go.sum'

      - name: Run integration tests
        run: make test-integration-shard INTEGRATION_SHARD=${{ matrix.shard }}

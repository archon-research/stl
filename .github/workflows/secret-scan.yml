# Secret scanning (gitleaks) across the whole repo and its full git history.
#
# Unlike security.yml (workflow-hygiene: actionlint/zizmor/sha-pin, deliberately
# scoped to .github/** changes), secret scanning must run on EVERY push and PR
# regardless of touched paths, otherwise a normal code PR that adds a hardcoded
# secret is never scanned. A weekly schedule re-scans history against updated
# gitleaks rules. (ORB-303)
#
# Actions are pinned to commit SHAs for supply-chain security.
name: Secret Scan

on:
  # `pull_request` carries no base-branch filter: scanning must cover every PR
  # regardless of base, or a secret on a stacked PR slips through.
  # `push` is scoped to main because an unfiltered `push` fired a second,
  # identical scan on every PR-branch push. Branch code still reaches main only
  # through a PR, and the weekly sweep re-scans full history either way.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"  # Mondays 04:23 UTC — full-history sweep

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history so gitleaks scans past commits, not just the working tree

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.18.2"
          GITLEAKS_SHA256="6298c9235dfc9278c14b28afd9b7fa4e6f4a289cb1974bd27949fc1e9122bdee"
          curl --fail --location --silent --show-error \
            -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose

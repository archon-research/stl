# Secret scanning (gitleaks) over the commits an event brings in, plus a weekly
# sweep of the full history.
#
# Unlike security.yml (workflow-hygiene: actionlint/zizmor/sha-pin, deliberately
# scoped to .github/** changes), secret scanning must run on EVERY push and PR
# regardless of touched paths, otherwise a normal code PR that adds a hardcoded
# secret is never scanned. A weekly schedule re-scans history against updated
# gitleaks rules. (ORB-303)
#
# Each push, PR and merge-queue run scans only the commit range the event adds
# (`git log <base>..HEAD`). Without a range gitleaks walks `git log --all`, so a
# finding on any unmerged branch fails the scan on every other PR in the repo.
#
# Actions are pinned to commit SHAs for supply-chain security.
name: Secret Scan

on:
  # No branch filters: secret scanning must cover every push and PR regardless
  # of branch, otherwise a secret added on a non-main branch/PR slips through.
  # `gh-readonly-queue/**` is the exception: `merge_group` below already covers
  # those refs, and a push run on one shares this workflow's concurrency group
  # with the merge_group run, so whichever starts second cancels the other.
  push:
    branches-ignore:
      - 'gh-readonly-queue/**'
  pull_request:
  # Required so this job reports inside the merge queue. Without it the check
  # cannot be made a required status check: the queue would wait forever on a
  # result that never arrives.
  merge_group:
  schedule:
    - cron: "23 4 * * 1"  # Mondays 04:23 UTC — full-history sweep

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  gitleaks:
    name: Secret Scan (Gitleaks)
    # Same-repo PRs are already covered by the `push` run on the identical SHA,
    # whose result shows on the PR, so the `pull_request` run would be a second
    # identical scan. Fork PRs have no such push event in this repo, so they
    # still need the `pull_request` run. `push`, `merge_group` and `schedule`
    # always run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the range base (a base branch or the pre-push SHA) must be present locally

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          # Keep .gitleaks.toml valid for this version. 8.18 silently ignores the
          # [[allowlists]] array form, so every suppression stops applying and the
          # scan reports 59 findings. Validate config changes against this pin.
          GITLEAKS_VERSION="8.30.0"
          GITLEAKS_SHA256="79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
          curl --fail --location --silent --show-error \
            -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.base_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push)         base="$PUSH_BEFORE" ;;
            pull_request) base="origin/$PR_BASE_REF" ;;
            merge_group)  base="$MERGE_GROUP_BASE_SHA" ;;
            *)            base="" ;;
          esac
          # A new branch's `before` is all zeros and a force-push's may no longer
          # exist; main is the nearest base that is guaranteed to.
          if [ -n "$base" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="origin/main"
          fi
          if [ -n "$base" ]; then
            echo "Scanning ${base}..HEAD"
            gitleaks detect --source . --verbose --log-opts="${base}..HEAD"
          else
            echo "Scanning full history"
            gitleaks detect --source . --verbose
          fi

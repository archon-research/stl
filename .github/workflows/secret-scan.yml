# Secret scanning (gitleaks) across the whole repo and its full git history.
#
# Unlike security.yml (workflow-hygiene: actionlint/zizmor/sha-pin, deliberately
# scoped to .github/** changes), secret scanning must run on EVERY push and PR
# regardless of touched paths, otherwise a normal code PR that adds a hardcoded
# secret is never scanned. A weekly schedule re-scans history against updated
# gitleaks rules. (ORB-303)
#
# Actions are pinned to commit SHAs for supply-chain security.
name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"  # Mondays 04:23 UTC — full-history sweep

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0  # full history so gitleaks scans past commits, not just the working tree

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.18.2"
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose

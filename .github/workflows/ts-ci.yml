name: TypeScript (stl-verify)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: stl-verify/ts

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: stl-verify/ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run workspace lint
        run: npm run lint

      - name: Run workspace format check
        run: npm run format:check

  build:
    name: Build (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    defaults:
      run:
        working-directory: stl-verify/ts

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: stl-verify/ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Panda codegen
        run: npm run prepare -w ui

      - name: Design-system doctor
        run: npm run doctor

      # After codegen, not before: the script loads src/lib/dashboard.ts through
      # vite, so the day its import graph reaches #styled-system/* it would fail
      # as though its assertions had.
      - name: Run explorer URL regression test
        run: npm run test:explorers -w ui

      - name: Typecheck workspace
        run: npm run type:check

      - name: Build workspace
        run: npm run build

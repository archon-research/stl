# Actions are pinned to commit SHAs for supply-chain security.
# To update: git ls-remote --tags https://github.com/<org>/<action>.git | grep <tag>
#
# Guards the property ORB-366's deploy comparison depends on: an image's layers
# are a function of its source and nothing else. See
# scripts/deploy/check-build-reproducible.sh for what is asserted and why the
# "must differ" control case is not optional.
#
# Scoped to build-mechanism inputs, not ordinary source/dependency changes:
# those are expected to change layers, so catching them here would not be a
# regression. .go-version/.python-version are included because the script
# reads them directly to pick the base image, not because they are "code".
# Four image builds per run, two of which run the arm64 runtime stage under
# QEMU.
#
# GAP: the harness calls `docker buildx build` directly with its own
# hardcoded --build-arg list — it never goes through the Makefile's
# _docker-release-image. A stamp reintroduced only on that path (e.g. via
# IMG_EXTRA_ARGS, or a new per-build arg added to GIT_ARGS) builds green here
# even though stl-verify/Makefile is listed in `paths` below.
name: Build Reproducibility

on:
  pull_request:
    paths:
      - "stl-verify/Dockerfile.common"
      - "stl-verify/Dockerfile.migrate"
      - "stl-verify/python/Dockerfile"
      - "stl-verify/.dockerignore"
      - "stl-verify/Makefile"
      - "stl-verify/internal/pkg/buildinfo/**"
      - ".go-version"
      - ".python-version"
      - "scripts/deploy/check-build-reproducible.sh"
      - ".github/workflows/build-reproducibility.yml"
  push:
    branches: [main]
    paths:
      - "stl-verify/Dockerfile.common"
      - "stl-verify/Dockerfile.migrate"
      - "stl-verify/python/Dockerfile"
      - "stl-verify/.dockerignore"
      - "stl-verify/Makefile"
      - "stl-verify/internal/pkg/buildinfo/**"
      - ".go-version"
      - ".python-version"
      - "scripts/deploy/check-build-reproducible.sh"
      - ".github/workflows/build-reproducibility.yml"
  workflow_dispatch:

concurrency:
  group: build-reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducible:
    name: Layers Depend Only On Source (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false # each image's verdict is independent and all are wanted
      matrix:
        image: [go, python, migrate]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      # BuildKit is a hard requirement, not a convenience: layer identity across
      # two builds comes from BuildKit reusing a cached layer when the content
      # feeding it is unchanged.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # No --cache-from: the check must prove the builds agree with each other
      # within this run, and a shared cache could supply a layer that hides a
      # disagreement between them.
      - name: Check that layers depend only on source
        run: scripts/deploy/check-build-reproducible.sh --image ${{ matrix.image }}

# Actions are pinned to commit SHAs for supply-chain security.
# To update: git ls-remote --tags https://github.com/<org>/<action>.git | grep <tag>
#
# Renovate runs self-hosted from this workflow, as it does in uikit and synome,
# rather than from the hosted App. RENOVATE_REPOSITORIES holds it to this
# repository. What it manages is in renovate.json5.
name: Renovate

on:
  schedule:
    # Weekly on Monday at 10:00 UTC, matching the dependabot schedule it takes
    # base images over from.
    - cron: '0 10 * * 1'
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    # Declaring any permission sets every scope not listed here to none, so this
    # block names everything Renovate touches. statuses carries the
    # renovate/stability-days check that minimumReleaseAge produces; without it
    # that POST 403s, and Renovate reports the failure as "Repository has changed
    # during renovation", ending the run before it opens anything.
    permissions:
      contents: write # branches for the update PRs
      pull-requests: write
      issues: write # the dependency dashboard, which gates major updates
      statuses: write # the renovate/stability-days check from minimumReleaseAge
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        env:
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_REPOSITORIES: ${{ github.repository }}
        with:
          configurationFile: renovate.json5
          token: ${{ secrets.GITHUB_TOKEN }}

# Actions are pinned to commit SHAs for supply-chain security.
# To update: git ls-remote --tags https://github.com/<org>/<action>.git | grep <tag>
name: Deploy

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      push:
        description: "Push images to ECR and run the deploy/promote jobs. Set false to build-only: validate and reuse the cache without exporting (warming) it."
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (defaults to HEAD of selected branch)"
        required: false
        type: string
      push:
        description: "Push images to ECR and update the staging image tags. Defaults to build-only (safe on any branch). Note: manual runs go to staging only; prod promotion and the staging health gate run only on the automated main deploy."
        required: false
        type: boolean
        default: false

jobs:
  build-push-staging:
    name: Build & Push Images (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: deploy-build-staging
      cancel-in-progress: false
    env:
      AWS_REGION: eu-west-1
      STAGING_REGISTRY: 579039992622.dkr.ecr.eu-west-1.amazonaws.com
      STAGING_ROLE_ARN: arn:aws:iam::579039992622:role/stl-sentinelstaging-github-actions-ecr
      # Set explicitly so the build can form valid image tags without an AWS STS
      # call. Lets build-only runs (push=false) work with no AWS credentials.
      AWS_ACCOUNT_ID: "579039992622"
    permissions:
      id-token: write
      contents: read
      packages: write  # push BuildKit layer cache to GHCR
    steps:
      # A short or malformed sha input gets stamped verbatim into every image
      # tag, and the 40-char-only update regex (update-staging / create-prod-pr)
      # can never rewrite it again, silently freezing the environment. Reject
      # anything that is not a full 40-char commit SHA before any build, push, or
      # tag commit. The automated path always supplies github.sha (40 chars), so
      # this only ever trips a hand-entered dispatch sha. Gates the whole
      # workflow: every tag-writing job depends on this one.
      - name: Validate deploy SHA is a full 40-char commit SHA
        env:
          DEPLOY_SHA: ${{ inputs.sha || github.sha }}
        run: |
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Deploy SHA '$DEPLOY_SHA' is not a full 40-char commit SHA. Pass the full SHA (git rev-parse <ref>); a short SHA poisons every image tag."
            exit 1
          fi
          echo "Deploy SHA OK: $DEPLOY_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # OIDC role assumption is only permitted from main, so skip AWS/ECR on
      # build-only runs (push=false), which can run from any branch.
      - name: Configure AWS credentials (staging)
        if: ${{ inputs.push }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to staging ECR
        if: ${{ inputs.push }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$STAGING_REGISTRY"

      # Layer cache lives in GHCR not ECR.
      # Only the final images are pushed to ECR; the cache manifests
      # are stored under one `buildcache` package, one tag per image.
      - name: Login to GHCR (build cache)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Resolve build-cache repo
        run: echo "DOCKER_CACHE_REPO=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/buildcache" >> "$GITHUB_ENV"

      - name: Build (and, when push=true, push) all images to staging ECR
        working-directory: stl-verify
        run: make docker-release-all ENV=sentinelstaging IMAGE_TAG=${{ inputs.sha || github.sha }} DOCKER_CACHE=1 DOCKER_CACHE_REPO="$DOCKER_CACHE_REPO" DOCKER_PUSH=${{ inputs.push && '1' || '0' }}

  update-staging:
    name: Update Staging Image Tags
    needs: build-push-staging
    if: ${{ inputs.push }}  # skip on build-only runs (nothing was pushed)
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-update-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write  # AWS OIDC for the pre-stamp ECR verify
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # ORB-299: read-only ECR creds so the pre-stamp verify below can confirm
      # every image the staging overlay references exists before we commit.
      - name: Configure AWS credentials (staging ECR read)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::579039992622:role/stl-sentinelstaging-github-actions-ecr
          aws-region: eu-west-1

      # ORB-362: the images block is rendered wholesale from the roster at the
      # exact main commit the bump is parented on (FETCH_HEAD), so the committed
      # block is always "what the roster at this revision renders" — the same
      # invariant deploy-prod verifies for prod, held here by construction (no
      # separate validator runs on staging).
      - name: Render staging images block and commit to main (via API for verified commits)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ inputs.sha || github.sha }}
          REPO: ${{ github.repository }}
          KUSTOMIZATION: k8s/overlays/staging/kustomization.yaml
          ROSTER: k8s/image-roster.txt
        run: |
          set -euo pipefail

          # Retry loop to handle concurrent updates to main
          MAX_RETRIES=3
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            echo "Attempt ${attempt}/${MAX_RETRIES}"

            # Fetch latest main. The overlay, the roster and the renderer all
            # come from that exact commit, and the bump is parented on it, so a
            # roster or renderer merge racing this job cannot leave the block
            # out of step with the tree deploy-prod validates.
            git fetch -q origin main
            MAIN_SHA=$(git rev-parse FETCH_HEAD)
            git checkout -q FETCH_HEAD -- "$KUSTOMIZATION" "$ROSTER" scripts/deploy/render-overlay-images.sh

            scripts/deploy/render-overlay-images.sh --env staging --tag "$SHA" --write "$KUSTOMIZATION"

            if git diff --quiet FETCH_HEAD -- "$KUSTOMIZATION"; then
              echo "No changes to commit"
              exit 0
            fi

            # ORB-299/ORB-313: verify the exact file about to be committed (this
            # fetched-and-rendered overlay), not the workflow's initial checkout,
            # so a concurrent merge cannot slip an unbuilt image past the gate.
            if ! scripts/deploy/verify-ecr-images.sh --kustomization "$KUSTOMIZATION"; then
              echo "::error::Refusing to stamp staging: overlay references image(s) missing from ECR."
              exit 1
            fi

            BASE_TREE=$(gh api "repos/${REPO}/git/commits/${MAIN_SHA}" --jq '.tree.sha')

            # Create a new tree with the updated file
            NEW_TREE=$(gh api "repos/${REPO}/git/trees" \
              --method POST \
              --input - <<TREE_EOF | jq -r '.sha'
          {
            "base_tree": "${BASE_TREE}",
            "tree": [{
              "path": "${KUSTOMIZATION}",
              "mode": "100644",
              "type": "blob",
              "content": $(jq -Rs . < "$KUSTOMIZATION")
            }]
          }
          TREE_EOF
            )

            # Create a verified commit via the API
            NEW_COMMIT=$(gh api "repos/${REPO}/git/commits" \
              --method POST \
              --field "message=deploy(staging): update image tags to ${SHA}" \
              --field "tree=${NEW_TREE}" \
              --field "parents[]=${MAIN_SHA}" \
              --jq '.sha')

            # Fast-forward main — fails if main moved since we fetched MAIN_SHA.
            if REF_OUTPUT=$(gh api "repos/${REPO}/git/refs/heads/main" \
              --method PATCH \
              --field "sha=${NEW_COMMIT}" 2>&1); then
              echo "Successfully updated main to ${NEW_COMMIT}"
              exit 0
            fi

            echo "Ref update failed: ${REF_OUTPUT}"
            echo "Retrying..."
            sleep 1
          done

          echo "::error::Failed to update main after ${MAX_RETRIES} attempts"
          exit 1

  wait-staging-healthy:
    name: Wait for Staging Healthy
    needs: update-staging
    if: ${{ inputs.push && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # Must outlast the retry budget of the grace window below, or the job dies
    # of its own timeout mid-retry and skips the prod promotion -- the exact
    # failure this is meant to prevent. Worst case: two fast Degraded exits
    # (~35s each) + two 120s holds + a final attempt that runs the full 900s
    # argocd-wait timeout ~= 20.2 min, so 20 was already too tight. See ORB-313.
    timeout-minutes: 30
    concurrency:
      group: deploy-wait-staging
      cancel-in-progress: false
    permissions:
      id-token: write
    # The verdict of whichever attempt last ran: later attempts only run when
    # the earlier one failed, so the highest-numbered non-empty summary is the
    # final one. Consumed by notify-staging-failure so the Slack alert names the
    # cause instead of just the job.
    outputs:
      failure-summary: >-
        ${{ steps.wait-attempt-3.outputs.failure-summary
            || steps.wait-attempt-2.outputs.failure-summary
            || steps.wait-attempt-1.outputs.failure-summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: archon-research/github-actions
          ref: dc756115d19ddccb2877312f420905e90b3b6d67  # argocd-wait failure diagnostics (github-actions #59)
          ssh-key: ${{ secrets.GH_ACTIONS_DEPLOY_KEY }}
          path: .github-actions
          persist-credentials: false

      # Grace window for a Degraded first rollout.
      #
      # argocd-wait fail-fasts on health=Degraded -- it exits 1 on the first
      # Degraded reading instead of waiting out its own `timeout`. So the ORB-313
      # timeout bumps never engage for the case they were added for: a brand-new
      # service reports Degraded while its first image is still landing. In #721
      # this gate failed 31s in ("app=stl-staging health=Degraded sync=Synced"),
      # the pod went Ready 50s later, and the prod promotion was skipped anyway.
      #
      # Retrying across a ~5min window absorbs that, since kubelet image-pull
      # backoff tops out around 5min. Only the final attempt is fatal, so a
      # genuinely broken rollout still fails the gate (just later).
      #
      # Collapse these three steps back into one once argocd-wait treats
      # Degraded as non-terminal until its timeout (fix belongs in
      # archon-research/github-actions).
      - id: wait-attempt-1
        continue-on-error: true
        uses: ./.github-actions/argocd-wait
        with:
          app: stl-staging
          server: http://argocd-prod-archon
          # Covers a genuinely slow (Progressing) rollout. It does NOT cover a
          # Degraded one -- see the grace-window comment above.
          timeout: "900"
          min-wait: "30"
          aws-role-arn: arn:aws:iam::030797368798:role/archonprod-github-actions-argocd-wait
          tailscale-secret-id: archon-prod-argocd-ci-tailscale-oauth
          argocd-token-secret-id: archon-prod-argocd-ci-token

      - name: Degraded — hold before retry
        if: steps.wait-attempt-1.outcome == 'failure'
        run: sleep 120

      - id: wait-attempt-2
        if: steps.wait-attempt-1.outcome == 'failure'
        continue-on-error: true
        uses: ./.github-actions/argocd-wait
        with:
          app: stl-staging
          server: http://argocd-prod-archon
          # Covers a genuinely slow (Progressing) rollout. It does NOT cover a
          # Degraded one -- see the grace-window comment above.
          timeout: "900"
          min-wait: "30"
          aws-role-arn: arn:aws:iam::030797368798:role/archonprod-github-actions-argocd-wait
          tailscale-secret-id: archon-prod-argocd-ci-tailscale-oauth
          argocd-token-secret-id: archon-prod-argocd-ci-token

      - name: Still degraded — final hold
        if: steps.wait-attempt-1.outcome == 'failure' && steps.wait-attempt-2.outcome == 'failure'
        run: sleep 120

      # No continue-on-error: this attempt decides the gate.
      - id: wait-attempt-3
        if: steps.wait-attempt-1.outcome == 'failure' && steps.wait-attempt-2.outcome == 'failure'
        uses: ./.github-actions/argocd-wait
        with:
          app: stl-staging
          server: http://argocd-prod-archon
          # Covers a genuinely slow (Progressing) rollout. It does NOT cover a
          # Degraded one -- see the grace-window comment above.
          timeout: "900"
          min-wait: "30"
          aws-role-arn: arn:aws:iam::030797368798:role/archonprod-github-actions-argocd-wait
          tailscale-secret-id: archon-prod-argocd-ci-tailscale-oauth
          argocd-token-secret-id: archon-prod-argocd-ci-token

  build-push-prod:
    name: Build & Push Images (Prod)
    needs: [build-push-staging, wait-staging-healthy]
    if: ${{ inputs.push && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-build-prod
      cancel-in-progress: false
    env:
      AWS_REGION: eu-west-1
      STAGING_REGISTRY: 579039992622.dkr.ecr.eu-west-1.amazonaws.com
      STAGING_ROLE_ARN: arn:aws:iam::579039992622:role/stl-sentinelstaging-github-actions-ecr
      PROD_REGISTRY: 030797368798.dkr.ecr.eu-west-1.amazonaws.com
      PROD_ROLE_ARN: arn:aws:iam::030797368798:role/stl-sentinelprod-github-actions-ecr
    permissions:
      id-token: write
      contents: read
    steps:
      # ORB-362: the promotion list IS the roster — the same file that renders
      # the overlays' images blocks — read at the built SHA so we promote exactly
      # what build-push-staging produced. If the roster on main has grown since,
      # verify-ecr-images fails the prod stamp closed and the next run heals it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - name: Read the promotion roster
        run: |
          set -euo pipefail
          # Assign before echoing so an invalid roster fails this step instead of
          # being masked by echo's exit status.
          SERVICES=$(scripts/deploy/render-overlay-images.sh --list services | tr '\n' ' ')
          CRONJOBS=$(scripts/deploy/render-overlay-images.sh --list cronjobs | tr '\n' ' ')
          if [ -z "$SERVICES" ] || [ -z "$CRONJOBS" ]; then
            echo "::error::roster produced an empty promotion list (services='${SERVICES}' cronjobs='${CRONJOBS}')"
            exit 1
          fi
          {
            echo "SERVICES=${SERVICES}"
            echo "CRONJOBS=${CRONJOBS}"
          } >> "$GITHUB_ENV"
          echo "services: ${SERVICES}"
          echo "cronjobs: ${CRONJOBS}"

      # Pull images from staging ECR, retag and push to prod (no build needed)
      - name: Configure AWS credentials (staging)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to staging ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$STAGING_REGISTRY"

      - name: Pull all images from staging ECR
        run: |
          SHA=${{ inputs.sha || github.sha }}
          for service in $SERVICES; do
            docker pull "$STAGING_REGISTRY/stl-sentinelstaging-$service:$SHA"
          done
          for cj in $CRONJOBS; do
            docker pull "$STAGING_REGISTRY/stl-sentinelstaging-cronjob:$cj-$SHA"
          done

      # Retag and push to prod ECR
      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to prod ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$PROD_REGISTRY"

      - name: Retag and push all images to prod ECR
        run: |
          SHA=${{ inputs.sha || github.sha }}
          for service in $SERVICES; do
            docker tag "$STAGING_REGISTRY/stl-sentinelstaging-$service:$SHA" "$PROD_REGISTRY/stl-sentinelprod-$service:$SHA"
            docker push "$PROD_REGISTRY/stl-sentinelprod-$service:$SHA"
          done
          for cj in $CRONJOBS; do
            docker tag "$STAGING_REGISTRY/stl-sentinelstaging-cronjob:$cj-$SHA" "$PROD_REGISTRY/stl-sentinelprod-cronjob:$cj-$SHA"
            docker push "$PROD_REGISTRY/stl-sentinelprod-cronjob:$cj-$SHA"
          done

  update-prod:
    name: Auto-merge Prod Image Tags
    needs: build-push-prod
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-update-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write  # AWS OIDC for the pre-stamp ECR verify
    outputs:
      deploy_sha: ${{ steps.commit.outputs.deploy_sha }}
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # ORB-299: read-only ECR creds so the pre-stamp verify can confirm every
      # image the prod overlay references exists in prod ECR before we commit.
      - name: Configure AWS credentials (prod ECR read)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::030797368798:role/stl-sentinelprod-github-actions-ecr
          aws-region: eu-west-1

      # Auto-merge the prod image bump straight to main (no PR), guarded so a
      # compromised CI/bot cannot smuggle anything else into a prod deploy:
      #   1. the diff must touch ONLY k8s/overlays/prod/kustomization.yaml,
      #   2. outside the generated images block the file must be byte-identical,
      #   3. every image in the file must resolve to our prod ECR account, and
      #   4. the images block must be exactly what k8s/image-roster.txt renders
      #      for prod at DEPLOY_SHA (ORB-362; the roster is reviewed code and,
      #      by guard 1, untouched here).
      # Any violation fails the job closed; nothing is committed. stl-prod stays
      # on MANUAL sync, so this commit does not roll out until the gated
      # deploy-prod job runs `argocd app sync` on the approved revision.
      # deploy-prod re-derives 1–4 independently on the committed revision.
      - name: Render, validate, and commit prod image tags to main
        id: commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DEPLOY_SHA: ${{ inputs.sha || github.sha }}
          REPO: ${{ github.repository }}
          PROD_ECR_PREFIX: 030797368798.dkr.ecr.eu-west-1.amazonaws.com/stl-sentinelprod-
          KUSTOMIZATION: k8s/overlays/prod/kustomization.yaml
          ROSTER: k8s/image-roster.txt
        run: |
          set -euo pipefail

          # Fail closed on a malformed deploy SHA before we touch main.
          if [[ ! "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::DEPLOY_SHA must be a 40-char lowercase git SHA: ${DEPLOY_SHA}"
            exit 1
          fi

          MAX_RETRIES=3
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            echo "Attempt ${attempt}/${MAX_RETRIES}"

            # The overlay, the roster and the renderer all come from the exact
            # main commit the bump is parented on, so a roster or renderer merge
            # racing this job cannot leave the block out of step with the tree
            # deploy-prod validates.
            git fetch -q origin main
            MAIN_SHA=$(git rev-parse FETCH_HEAD)
            git checkout -q FETCH_HEAD -- "$KUSTOMIZATION" "$ROSTER" scripts/deploy/render-overlay-images.sh

            # Render the whole images block from the roster (ORB-362). ci.yml
            # deploy-base reads this file's newTag off origin/main as the
            # last-promoted marker that main change detection diffs against
            # (ORB-361); the renderer owns the tag shape both rely on.
            scripts/deploy/render-overlay-images.sh --env prod --tag "$DEPLOY_SHA" --write "$KUSTOMIZATION"

            if git diff --quiet FETCH_HEAD -- "$KUSTOMIZATION"; then
              echo "Prod already at ${DEPLOY_SHA}; nothing to commit"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # GUARD 1: only the prod kustomization may change.
            CHANGED_FILES=$(git diff --name-only FETCH_HEAD)
            if [ "$CHANGED_FILES" != "$KUSTOMIZATION" ]; then
              echo "::error::Prod deploy diff touches unexpected files:"
              echo "$CHANGED_FILES"
              exit 1
            fi

            # GUARD 2: outside the generated images block the file must be
            # byte-identical to main — the renderer may replace that block and
            # nothing else.
            git show "FETCH_HEAD:${KUSTOMIZATION}" > "${RUNNER_TEMP}/kustomization.main.yaml"
            if ! diff -u \
                <(scripts/deploy/render-overlay-images.sh --strip "${RUNNER_TEMP}/kustomization.main.yaml") \
                <(scripts/deploy/render-overlay-images.sh --strip "$KUSTOMIZATION"); then
              echo "::error::Prod deploy diff changes ${KUSTOMIZATION} outside the images block."
              exit 1
            fi

            # GUARD 3: every image name must START WITH our prod ECR account.
            # Anchored (not substring) so a name that merely embeds the prefix
            # elsewhere (e.g. evil.example/030797...) cannot pass.
            BAD_IMAGES=$(awk -v p="$PROD_ECR_PREFIX" '
              /^[[:space:]]*newName:/ {
                v=$0; sub(/^[[:space:]]*newName:[[:space:]]*/,"",v); gsub(/^"|"$/,"",v)
                if (index(v,p)!=1) print
              }' "$KUSTOMIZATION")
            if [ -n "$BAD_IMAGES" ]; then
              echo "::error::Prod kustomization references images outside the prod ECR account:"
              echo "$BAD_IMAGES"
              exit 1
            fi

            # GUARD 4: the images block must be exactly the roster's render for
            # prod at DEPLOY_SHA — every entry, repo and tag, byte for byte.
            if ! scripts/deploy/render-overlay-images.sh --env prod --tag "$DEPLOY_SHA" --check "$KUSTOMIZATION"; then
              echo "::error::Prod images block is not what k8s/image-roster.txt renders at ${DEPLOY_SHA}."
              exit 1
            fi

            # ORB-299: verify every image the (now rendered) prod overlay
            # references exists in prod ECR, against the exact file about to be
            # committed. Promotion-list drift is gone by construction (list and
            # block share the roster); this still catches a roster on main that
            # grew past what this run built, failing closed until the next run.
            if ! scripts/deploy/verify-ecr-images.sh --kustomization "$KUSTOMIZATION"; then
              echo "::error::Refusing to stamp prod: overlay references image(s) missing from prod ECR."
              exit 1
            fi

            SHORT_SHA=${DEPLOY_SHA:0:7}
            BASE_TREE=$(gh api "repos/${REPO}/git/commits/${MAIN_SHA}" --jq '.tree.sha')

            NEW_TREE=$(gh api "repos/${REPO}/git/trees" \
              --method POST \
              --input - <<TREE_EOF | jq -r '.sha'
          {
            "base_tree": "${BASE_TREE}",
            "tree": [{
              "path": "${KUSTOMIZATION}",
              "mode": "100644",
              "type": "blob",
              "content": $(jq -Rs . < "$KUSTOMIZATION")
            }]
          }
          TREE_EOF
            )

            NEW_COMMIT=$(gh api "repos/${REPO}/git/commits" \
              --method POST \
              --field "message=deploy(prod): update image tags to ${SHORT_SHA}" \
              --field "tree=${NEW_TREE}" \
              --field "parents[]=${MAIN_SHA}" \
              --jq '.sha')

            # Fast-forward main — fails if main moved since we fetched MAIN_SHA.
            if REF_OUTPUT=$(gh api "repos/${REPO}/git/refs/heads/main" \
              --method PATCH \
              --field "sha=${NEW_COMMIT}" 2>&1); then
              echo "Committed prod tag bump to main as ${NEW_COMMIT}"
              echo "deploy_sha=${NEW_COMMIT}" >> "$GITHUB_OUTPUT"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Ref update failed: ${REF_OUTPUT}"
            echo "Retrying..."
            sleep 1
          done

          echo "::error::Failed to update main after ${MAX_RETRIES} attempts"
          exit 1

  notify-staging-failure:
    name: Notify Staging Deploy Failure
    if: ${{ always() && (needs.build-push-staging.result == 'failure' || needs.update-staging.result == 'failure' || needs.wait-staging-healthy.result == 'failure') }}
    needs: [build-push-staging, update-staging, wait-staging-healthy]
    uses: ./.github/workflows/slack-notify.yaml
    with:
      status: failure
      context: Staging Deploy
      failed-jobs: |
        Build & Push Images (Staging)=${{ needs.build-push-staging.result }}
        Update Staging Image Tags=${{ needs.update-staging.result }}
        Wait for Staging Healthy=${{ needs.wait-staging-healthy.result }}
      # Empty for the two build/tag jobs, which report their own failures well
      # enough; set when the ArgoCD gate is what failed, where the job name
      # alone said nothing and the reason had to be dug out of the ArgoCD UI.
      body: ${{ needs.wait-staging-healthy.outputs.failure-summary && format('```{0}```', needs.wait-staging-healthy.outputs.failure-summary) || '' }}
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_STAGING }}
      gh-actions-deploy-key: ${{ secrets.GH_ACTIONS_DEPLOY_KEY }}

  # Prod image build + tag bump stay in this workflow (deploy-prod.yaml only owns
  # the gated ArgoCD sync). Their failures still route to the prod channel, as
  # they did before the split.
  notify-prod-build-failure:
    name: Notify Prod Build Failure
    if: ${{ always() && (needs.build-push-prod.result == 'failure' || needs.update-prod.result == 'failure') }}
    needs: [build-push-prod, update-prod]
    uses: ./.github/workflows/slack-notify.yaml
    with:
      status: failure
      context: Prod Deploy
      failed-jobs: |
        Build & Push Images (Prod)=${{ needs.build-push-prod.result }}
        Auto-merge Prod Image Tags=${{ needs.update-prod.result }}
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_PROD }}
      gh-actions-deploy-key: ${{ secrets.GH_ACTIONS_DEPLOY_KEY }}

  # ORB-313: when the staging health gate fails, build-push-prod is *skipped*
  # (not failed), so prod promotion silently stops with no alert. Make that
  # explicit on the prod channel. Fires only when staging built + stamped fine
  # and the gate itself failed (wait=failure => build-push-staging succeeded).
  notify-prod-promotion-skipped:
    name: Notify Prod Promotion Skipped
    if: ${{ always() && inputs.push && github.event_name != 'workflow_dispatch' && needs.wait-staging-healthy.result == 'failure' && needs.build-push-prod.result == 'skipped' }}
    needs: [wait-staging-healthy, build-push-prod]
    uses: ./.github/workflows/slack-notify.yaml
    with:
      status: failure
      context: Prod Promotion Skipped
      body: |
        Prod promotion was skipped because the staging health gate did not pass.
        This is often a slow first rollout of a new service image, not a regression.
        No prod images were built or promoted.

        Recovery: once `stl-staging` is Healthy and Synced in ArgoCD, re-run the
        failed jobs on this workflow run. Prod promotion still sits behind the
        manual `production` approval gate.
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_PROD }}
      gh-actions-deploy-key: ${{ secrets.GH_ACTIONS_DEPLOY_KEY }}

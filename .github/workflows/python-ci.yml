name: Python (stl-verify)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: stl-verify/python

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          working-directory: stl-verify/python

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Type check
        id: typecheck
        run: make typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: make lint

      # The committed schema is what the TS UI's typegen consumes and what the
      # deprecation notices on this API are published through, so a response-model
      # change that skips the regeneration silently breaks both.
      - name: OpenAPI schema is in sync with the response models
        if: ${{ !cancelled() }}
        run: |
          make export-openapi-schema
          if ! git diff --exit-code -- ../ts/ui/src/generated/openapi-schema.json; then
            echo "::error::openapi-schema.json is stale — run 'make export-openapi-schema' in stl-verify/python and commit the result"
            exit 1
          fi

  test:
    name: Tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    defaults:
      run:
        working-directory: stl-verify/python

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          working-directory: stl-verify/python

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Unit tests
        run: make test-unit

      # Derive image tag directly from the Python source so this step is always
      # aligned with what the tests actually use. The single source of truth is
      # stl-verify/python/tests/integration/conftest.py.
      - name: Pull container images
        run: |
          IMAGE=$(grep -oP 'TIMESCALEDB_IMAGE\s*=\s*"\K[^"]+' tests/integration/conftest.py)
          if [ -z "$IMAGE" ]; then
            echo "::error::No TIMESCALEDB_IMAGE constant found in stl-verify/python/tests/integration/conftest.py — check the grep pattern"
            exit 1
          fi
          docker pull "$IMAGE"

      # Integration tests require Docker (testcontainers spins up TimescaleDB automatically)
      - name: Integration tests
        run: make test-integration
